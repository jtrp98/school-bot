<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Block Lab หน้าหลัก A2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:#14243D}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input[type=checkbox]:focus-visible,input[type=radio]:focus-visible,input[type=range]:focus-visible{outline:3px solid #1866C9;outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid #C6D6EA;border-bottom-width:4px;background:#fff;color:#14243D;font-size:16px;font-weight:600;line-height:1.6}
.sp{animation:bl-spin .8s linear infinite}
@keyframes bl-spin{to{transform:rotate(360deg)}}
@keyframes bl-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop{animation:bl-in .2s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.sp{animation:none}.pop{animation:none}}
/* tab (segmented · CI §11.6 · OQ126): ราง #DCE3EC · tab สูง 44 · เลือก = พื้นขาว + เงาเบา DSG-20 + ตัว/ไอคอน action-primary ไม่มีกรอบสี */
.tt{display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;height:44px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:#5A6377;font-size:16px;font-weight:700;line-height:1.6;white-space:nowrap}
.tt:hover{background:#EAF2FD;color:#14243D}
.tt.on{background:#FFFFFF;color:#1866C9;box-shadow:0 1px 3px rgba(20,36,61,.18)}
.tt[aria-disabled="true"]{background:#F4F6F8;color:#5A6377;box-shadow:inset 0 0 0 2px #DCE3EC;cursor:not-allowed}
/* ชุดที่ 5 (ข้อ 7/13): tooltip CI §11.8 (data-tip · ไม่ใช้ title) · .tipb = ใต้ปุ่ม · .tipe = ชิดขวา · .tipl = ฝั่งซ้าย · ปุ่มไอคอน .hb 44×44 (§11.11) · ปุ่มเริ่ม/หยุดจำลองในหัวแผงขวา .rb · ปุ่มมีข้อความในที่จับที่หุบ .gb */
.tip{position:relative}
.tip::after{content:attr(data-tip);display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);z-index:40;padding:4px 12px;border-radius:8px;background:#14243D;color:#FFFFFF;font-size:14px;font-weight:500;line-height:1.6;white-space:nowrap;text-align:left;pointer-events:none}
.tip:hover::after,.tip:focus-visible::after{display:block}
.tip[data-tip=""]::after{display:none!important}
.tipb::after{bottom:auto;top:calc(100% + 8px)}
.tipe::after{left:auto;right:0;transform:none}
.tipl::after{left:auto;right:calc(100% + 8px);bottom:auto;top:50%;transform:translateY(-50%)}
.hb{display:inline-flex;align-items:center;justify-content:center;position:relative;width:44px;height:44px;padding:0;border:0;border-radius:12px;background:transparent;color:#14243D;flex-shrink:0}
.hb:hover{background:#EAF2FD}
.rb{display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;height:46px;padding:0 16px;border-radius:12px;font-size:16px;font-weight:700;line-height:1.6;white-space:nowrap;flex-shrink:0}
.rb[aria-disabled="true"]{cursor:not-allowed}
.gb{display:inline-flex;align-items:center;justify-content:flex-start;gap:8px;box-sizing:border-box;width:100%;height:44px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:#14243D;font-size:16px;font-weight:700;line-height:1.6;white-space:nowrap}
.gb:hover{background:#EAF2FD}
.gb[aria-disabled="true"]{background:#F4F6F8;color:#5A6377;box-shadow:inset 0 0 0 2px #DCE3EC;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* รอบ 14 (R3 · OQ144 · ชุดที่ 6): dialog เตือนก่อนกลับโหมดบล็อกจากโหมดโค้ดที่แก้แล้ว (CI §11.10) · คลาสใหม่ขึ้นต้น cmd- เท่านั้น (helmet ทุกชิ้นส่วนรวมเป็น CSS เดียวกันทั้งหน้า) */
.cmd-bp,.cmd-b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;box-sizing:border-box;padding:0 16px;border-radius:12px;font-size:16px;font-weight:700;line-height:1.5;white-space:nowrap}
.cmd-bp{border:0;border-bottom:4px solid #0F4C99;background:#1866C9;color:#FFFFFF}
.cmd-b2{border:2px solid #C6D6EA;border-bottom-width:4px;background:#FFFFFF;color:#14243D}
.cmd-b2:hover{background:#EAF2FD}
.cmd-bp:active,.cmd-b2:active{border-bottom-width:2px;transform:translateY(2px)}
</style>
</helmet>
<!-- รอบ 10 (2026-10-26 · ชุดที่ 5 พื้นที่ต่อบล็อก + จำลอง + โค้ด): (1) สถานะเริ่มต้น = หยุด (run ค่าเริ่มต้น idle · เดิม running) (2) ปุ่ม เริ่ม/หยุดจำลอง อยู่ในแผงขวา (หัวแผง) ไม่อยู่ในลิ้นชักแล้ว (OQ105) · แผงขวาซ่อนเป็นค่าเริ่มต้น เหลือที่จับเล็กมุมขวาบน (▶ เริ่มจำลอง + ตัวบอก "กำลังจำลอง" + ปุ่ม เปิดตัวจำลอง · OQ113) (3) แถบ "หยุดเพราะแก้ไข" ปุ่ม = "ไปที่ตัวจำลอง" (4) แถบแจ้ง/การ์ด เว้นชุดปุ่มเลื่อน/ซูมแนวตั้งมุมขวาล่าง (BlocksPaneA2)
     รอบ 7 (2026-10-26 · CI ทั้งหน้า ชุดที่ 3): พื้นที่ 840 มีกรอบครอบ content (ขอบนอก 24 · ห่างแถบบน 12 · ห่างล่าง 16 · ระหว่างแผง 12 / 24 · แผง surface ขอบ 2px radius 16) · tab ทุกตัวแบบ CI (ราง #DCE3EC · เลือก = พื้นขาว + เงาเบา) · แถบหมวดซ้าย = CatRailA2 · popup/dialog/toast ตาม §11.8–11.10 (CardsA2 · PreflightDialogA2 · ฉากหลัง .35 · z 20/30/50) · tooltip แทน title (BlocksPaneA2) · พื้นที่ต่อบล็อกเหลือ 856×516 (ลิ้นชักขยาย) / 856×740 (ยุบ)
     A2 (บอร์ดสำรวจ · คัดจาก A · A ต้นฉบับไม่แก้) · เลย์เอาต์ตามภาพอ้างอิง (2026-10-22 รอบ 3): แถบหน้าต่าง 60 (WindowBarA2 · รอบ 6 ส่วนหัว: home › ☰ › โลโก้ › | › ว่าง › | › ชิป Uno + เปลี่ยน › | › ชื่องาน › | › [ชิปคลาวด์ เฉพาะผิดปกติ · tweak cloud] › | › ย่อ/ขยาย/ปิด) + พื้นที่ 840 ไม่มีแถบหัวชั้นที่ 2 ไม่มีแถบล่าง · พื้นที่ 840 = BlocksPaneA2 ทั้งชิ้น: แถบหมวด 112 + รายการบล็อก 424 + พื้นที่ต่อบล็อก (560 ตอนลิ้นชักขยาย / 784 ตอนยุบ) + ลิ้นชัก Output | โค้ด C++ (280 / 56) · แถวแท็บลิ้นชักมีปุ่ม ปัญหา N ข้อ · เริ่ม/หยุดจำลอง · หยุดทั้งหมด · ส่งลงบอร์ด (อยู่ใน BlocksPaneA2 · สถานะและ callback ส่งผ่าน prop จากไฟล์นี้) · เป้าหมายบล็อก = บอร์ดตายตัว (ไม่มีหมวดตัวละคร/ตัวสลับ) · prop panels: hide (ค่าเริ่มต้น) ซ่อนตัวจำลอง/stage · show = เปิดคอลัมน์ขวา 680×840 · ขัด R10, R11 (ส่วนหัว + แถบล่าง) และ R3 ของ my-work โดยตั้งใจ (ดู D1 §A2 · OQ72, OQ78–OQ81) · รอบ 4 (2026-10-22): BlocksPaneA2 ต่อบล็อกได้จริง (โมเดลโปรแกรมอยู่ในชิ้นส่วน) · ไฟล์นี้รับ callback on-edit (แก้ตอนจำลอง → run = edited · R10) และ on-issues (จำนวนปัญหา R17 + ช่องว่าง R16 จากโมเดล → ชิป/ป๊อปอัป/ปุ่มส่ง/แปลงโค้ดไม่ผ่าน) · tweak program = โหลดโปรแกรมตัวอย่างแทนที่โมเดล -->
<div onPointerDownCapture="{{mPtr}}" onKeyDownCapture="{{mKey}}" style="position:relative;width:1440px;height:900px;background:#F4F7FB;overflow:hidden;color:#14243D">

  <!-- แถบหน้าต่าง 60 (สำเนา A2 · ชั้นต่ำกว่า z-stop ตาม CR-10) + พื้นที่ 840 = 900 · [แก้ 2026-10-28 ข้อ 1.13] กล่องหุ้มแถบเป็น stacking context: เดิม z 10 ทำให้ popover/เมนู/tooltip ข้างใน (z 40) ถูกตัดชั้นเหลือ 10 → ปุ่มใน body (เช่น ปุ่มเปิดแผงบล็อก z 24) ทับเมนู ☰ · ยกเป็น z-popover 40 + กล่อง BlocksPaneA2 เป็น z-base 0 (ชั้นข้างในไม่รั่วขึ้นมาแข่งกับส่วนหัว) -->
  <div style="position:absolute;left:0;top:0;width:1440px;height:60px;z-index:40">
    <dc-import name="WindowBarA2" os="{{os}}" chip="{{chip}}" work="{{workSave}}" menu="{{menuState}}" job="กดปุ่มแล้วไฟติด" time="10:20" port="COM3" busy="{{sendBusy}}" ovh="{{ovhStr}}" cloud="{{cloudP}}" cloud-pop="{{cloudPopP}}" mode="{{modeP}}" on-mode="{{onMode}}" mode-warn="{{modeWarnP}}" on-mode-stay="{{modeStay}}" on-mode-go="{{modeGo}}" on-change-board="{{onChangeBoard}}" on-reconnect="{{onReconnect}}" debug="{{debugP}}" hint-size="1440px,60px"></dc-import>
  </div>
  <!-- A2 ข้อ 1.5 (OQ175): ปุ่ม เปลี่ยน → หน้าเชื่อมบอร์ด ConnectUnoA2 (prototype link · กดผ่าน onChangeBoard) -->
  <a href="ConnectUnoA2.dc.html" data-go-cu="1" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">ไปหน้าเชื่อมบอร์ด Uno</a>

  <!-- รอบ 6: เมนู ☰ ย้ายเข้า WindowBarA2 (เมนู/ชิป/dialog ของส่วนหัวอยู่ในชิ้นส่วนเอง · scrim/dialog สูงถึง ovh = ขอบบนแถวแท็บ ไม่บังปุ่มหยุดทั้งหมด) -->

  <!-- พื้นที่ 840 (top 60) มีกรอบครอบ content (CI §11.1 · ชุดที่ 3): ขอบนอก 24 · ห่างแถบบน 12 · ห่างล่าง 16 → กรอบ x24 y72 กว้าง 1392 สูง 812 (ตอนซ่อนตัวจำลอง/stage · 688 ตอนเปิดคอลัมน์ขวา เว้น 24 ระหว่างแผงซ้าย–ขวา) · ข้างในมี 2 แผงเว้น 12: แผงที่ 1 แถบหมวด + รายการบล็อก + พื้นที่ต่อบล็อก (516 ตอนลิ้นชักขยาย / 740 ตอนยุบ) · แผงที่ 2 ลิ้นชัก Output | C++ (284 / 60) · พื้นหลังหน้า = background #F4F7FB -->
  <!-- R22 รอบ 3 (OQ228 · 2026-11-03): ระหว่างลากบล็อก/ค่าที่รับ (และ effect หดหาย 260ms) BlocksPaneA2 แจ้ง on-lift=true → ยกกล่องนี้เป็น z 70 (เหนือส่วนหัว 40 · แถบแจ้ง/การ์ด 50 · แผงขวา) ให้บล็อกที่ลาก + ป้าย "ปล่อยเพื่อลบ" ตามเคอร์เซอร์ทั้งหน้า · ปกติ z 0 เหมือนเดิม (ข้อ 1.13) -->
  <div style="{{paneWrapStyle}}">
    <dc-import name="BlocksPaneA2" on-lift="{{onPaneLift}}" w="{{paneW}}" h="812" program="{{program}}" cat="{{cat}}" dd="{{ddProp}}" hl="{{hlFlag}}" debug="{{debugP}}" drawer="{{drawerNow}}" dtab="{{dtabP}}" serial="{{serialP}}" paused="{{pausedP}}" run="{{run}}" issues="{{issuesStr}}" show-issues="{{showIssues}}" send-busy="{{sendBusy}}" on-cat="{{pickCat}}" on-go-sim="{{goSim}}" on-stop-all="{{stopAll}}" on-send="{{sendBoard}}" on-open-pf="{{openPf}}" on-drawer="{{onDrawer}}" on-edit="{{onEdit}}" on-issues="{{onIssues}}" mode="{{modeP}}" code-demo="{{codeDemoP}}" term="{{termP}}" term-sys="{{termSysP}}" out-tick="{{outTickP}}" goto-line="{{gotoLineP}}" on-go-line="{{onGoLine}}" on-code-register="{{onCodeRegister}}" on-code-state="{{onCodeState}}" sim-open="{{simOpenP}}" on-toggle-sim="{{toggleSim}}" hint-size="1392px,812px"></dc-import>
  </div>

  <!-- ขวา 680×812 (เฉพาะ panels=show): แผงขวา · พื้น surface · radius 16 · ขอบ 2px เป็นชั้นทับ · หัวแผง 76 (padding 12) มีราง tab ตัวจำลอง | เวที + pill สถานะ · เนื้อ 736 -->
  <sc-if value="{{showPanels}}" hint-placeholder-val="{{false}}">
    <div id="ma2-right" role="region" aria-label="ตัวจำลองและเวที" style="position:absolute;left:736px;top:72px;width:680px;height:812px;border-radius:16px;overflow:hidden;background:#fff">
      <div style="position:absolute;left:0;top:0;width:680px;height:76px;box-sizing:border-box;background:#fff;border-bottom:1px solid #DCE3EC;display:flex;align-items:center;gap:12px;padding:12px">
        <div role="tablist" aria-label="ตัวจำลองและเวที" style="display:flex;align-items:center;gap:4px;padding:4px;background:#DCE3EC;border-radius:12px;flex-shrink:0">
          <button class="{{simCls}}" role="tab" id="ma2t-sim" aria-selected="{{isSim}}" tabindex="{{simTi}}" onClick="{{tabSim}}" onKeyDown="{{tabKey}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7zM9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"></path></svg><span>ตัวจำลอง</span></button>
          <button class="{{stageCls}}" role="tab" id="ma2t-stage" aria-selected="{{isStage}}" tabindex="{{stageTi}}" onClick="{{tabStage}}" onKeyDown="{{tabKey}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"></path></svg><span>เวที (stage)</span></button>
        </div>
        <div style="flex:1;min-width:0"></div>
        <!-- ชุดที่ 5 (OQ105 · OQ113 · ข้อ 7/13): ปุ่ม เริ่ม/หยุดจำลอง อยู่ที่หัวแผงขวา (เห็นทั้งแท็บตัวจำลองและเวที · คุมทั้งสองพร้อมกัน R10) · ตัวบอกสถานะ (pill) แสดงเมื่อไม่ใช่ "พร้อมจำลอง" · ปุ่มซ่อนแผง (ไอคอน) อยู่ท้ายแถว -->
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <sc-if value="{{hasPill}}" hint-placeholder-val="{{true}}">
            <div style="{{pillStyle}}" role="status"><svg class="{{pillIconClass}}" viewBox="0 0 24 24" aria-hidden="true"><path d="{{pillIcon}}"></path></svg><span>{{pillText}}</span></div>
          </sc-if>
          <button type="button" class="rb tip tipb" data-tip="{{runTip}}" aria-label="{{runAria}}" aria-disabled="{{runDis}}" onClick="{{toggleRun}}" style="{{runBtnStyle}}"><svg class="{{runIconClass}}" viewBox="0 0 24 24" aria-hidden="true"><path d="{{runIcon}}"></path></svg><span>{{runLabel}}</span></button>
          <!-- 2026-11-02 (ผู้ใช้สั่ง · R9): ปุ่ม หยุดทั้งหมด ย้ายมาที่นี่ (จากแถวแท็บลิ้นชัก) · ต่อท้ายปุ่มเริ่ม/หยุดจำลอง ก่อนปุ่มซ่อนแผง · ■ 46×46 ขอบ/ไอคอน #D32F2F พื้นขาว (brand §11.x) · z-index 40 = อยู่เหนือฉากหลัง dialog (z 20) → กดได้ตลอดแม้เปิดป๊อปอัป (CR-10 · R9) · กดได้เสมอ -->
          <button id="ma2-stop" type="button" class="rb tip tipb" data-tip="หยุดทั้งหมด" aria-label="หยุดทั้งหมด" onClick="{{stopAll}}" style="width:46px;padding:0;z-index:40;background:#fff;color:#D32F2F;border:2px solid #D32F2F;border-bottom:4px solid #D32F2F"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;fill:currentColor" aria-hidden="true"><path d="M8 6h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"></path></svg></button>
          <button id="ma2-hide" type="button" class="hb tip tipb tipe" data-tip="ซ่อนตัวจำลองและเวที" aria-label="ซ่อนตัวจำลองและเวที" aria-expanded="true" aria-controls="ma2-right" onClick="{{hidePanel}}"><svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM15 3v18M8 9l3 3-3 3"></path></svg></button>
        </div>
      </div>

      <sc-if value="{{isSim}}" hint-placeholder-val="{{true}}">
        <div style="{{contentStyle}}">
          <dc-import name="SimPaneA2" circuit="{{circuit}}" run="{{run}}" pressed="{{pressedFlag}}" pot="{{pot}}" led="{{ledState}}" h="{{contentH}}" onPress="{{press}}" onRelease="{{release}}" onKeyDown="{{kd}}" onKeyUp="{{ku}}" onPot="{{onPot}}" hint-size="680px,784px"></dc-import>
        </div>
      </sc-if>
      <sc-if value="{{isStage}}" hint-placeholder-val="{{false}}">
        <div style="{{contentStyle}}">
          <dc-import name="StagePaneA2" pose="{{stagePose}}" say="" x="0" y="0" frozen="{{frozenText}}" fast="no" state="{{stageState}}" h="{{contentH}}" hint-size="680px,784px"></dc-import>
        </div>
      </sc-if>

      <sc-if value="{{hasBannerShow}}" hint-placeholder-val="{{false}}">
        <div style="{{bannerStyleShow}}" role="status">
          <svg class="{{bannerIconClass}}" viewBox="0 0 24 24" style="width:24px;height:24px" aria-hidden="true"><path d="{{bannerIcon}}"></path></svg>
          <div style="flex:1;min-width:0;font-size:18px;font-weight:600;line-height:1.5">{{bannerText}}<span style="font-size:14px;font-weight:500;color:#5A6377">{{bannerCode}}</span></div>
          <button class="btn" onClick="{{bannerAction}}" style="min-height:44px">{{bannerButton}}</button>
        </div>
      </sc-if>

      <!-- ขอบแผงขวา 2px (ชั้นทับ · ไม่รับเมาส์) -->
      <div aria-hidden="true" style="position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;border:2px solid #DCE3EC;border-radius:16px;pointer-events:none;z-index:30"></div>
    </div>
  </sc-if>

      onIssues: (n, g) => this.setState({ mIssues: n, mGaps: g }),
      // หยุดทั้งหมด (R9 · OQ79): หยุดจำลอง + แจ้งด้วยการ์ด stop0 (หยุดตัวจำลอง/ตัวละคร · โปรแกรมบนบอร์ดอาจยังทำงาน เพราะ DEV-Q16 ยังไม่ตอบ) · กดได้เสมอ ไม่ถูกปิดกั้นด้วยป๊อปอัป
      stopAll: () => { this.setState({ run: 'idle', pressed: false, card: 'stop0' }); clearCard(3500); },
      // ส่งลงบอร์ด (R9/R17): มีปัญหา → ป๊อปอัป mode=send (ส่งถูกปิดกั้น) · ไม่ได้เชื่อม Uno → การ์ด nodevice · ปกติ → แปลงโค้ด → ส่ง → สำเร็จ (ตัวอย่างอัตโนมัติ)
      sendBoard: () => {
        if (busy) return;
        // โหมดบล็อก: ป๊อปอัป R17 เดิม · โหมดโค้ด (OQ161): ไม่ปิดกั้นการส่ง (ส่งได้เสมอ) แปลงโค้ดก่อน ไม่ผ่านแจ้งใน Output "ยังไม่ได้ส่ง บอร์ดยังใช้โปรแกรมเดิม" ไม่ใช่การ์ดสถานะ
        if (issueN > 0) { this.setState({ pf: 'open', pfSend: true }); return; }
        if (chip !== 'connected') { this.setState({ card: 'nodevice' }); clearCard(4500); return; }
        this.setState({ card: 'compile' });
        if (codeMode) {
          setTimeout(() => {
            const errs = compileCode();
            if (errs.length) { this.setState({ card: 'none', live: 'แปลงโค้ดไม่ผ่าน ยังไม่ได้ส่ง บรรทัด ' + errs[0].line }); reportErr(errs, true); return; }
            this.setState({ card: 'send' });
            setTimeout(() => this.setState({ card: 'success' }), 1400);
            clearCard(4800);
          }, 1200);
          return;
        }
        setTimeout(() => this.setState({ card: 'send' }), 1200);
        setTimeout(() => this.setState({ card: 'success' }), 2600);
        clearCard(6000);
      },
      sendBusy: busy ? 'yes' : 'no',
      issuesStr: String(issueN), showIssues: (issueN > 0 && !pfOn) ? 'yes' : 'no',
      onDrawer: (v) => this.setState({ drawerS: v === 'closed' ? 'closed' : 'open' }),
      drawerNow,
      showPanels: !hideMode, paneW: String(paneW),
      // R22 รอบ 3: ยกชั้นกล่อง BlocksPaneA2 ระหว่างลาก (ดู comment ที่กล่อง)
      paneWrapStyle: 'position:absolute;left:24px;top:72px;height:812px;z-index:' + ((this.state || {}).paneLift ? 70 : 0),
      onPaneLift: (v) => { if (!!(this.state || {}).paneLift !== !!v) this.setState({ paneLift: !!v }); },
      program, cat: String(cat),
      ddProp: pick('dd', 'closed'),
      hlFlag: S.hl === 'yes' ? 'yes' : 'no',
      // รอบ 11: Tweak debug ส่งต่อให้ BlocksPaneA2 (ตัวบอกวินิจฉัยเหตุการณ์ลาก/ซ่อน · ปิดเป็นค่าเริ่มต้น)
      debugP: pick('debug', 'off') === 'on' ? 'on' : 'off',
      dtabP: P.dtab === 'cpp' ? 'cpp' : 'out',
      serialP: P.serial || 'sim',
      pausedP: P.paused === 'yes' ? 'yes' : 'no',
      pickCat: (n) => this.setState({ cat: n }),
      goSim: () => this.setState({ tab: 'sim', panels: 'show' }),
      openPf: () => { if (codeMode) return; this.setState({ pf: 'open', pfSend: false }); },
      pfOn, pfMode, pfN: String(pfN),
      pfBack: () => this.setState({ pf: 'closed', pfSend: false }),
      pfContinue: () => this.setState({ pf: 'closed', pfSend: false, run: mGaps > 0 ? 'compile-error' : 'running', pressed: false, panels: mGaps > 0 ? (S.panels) : 'show' }),
      pfPick: (idx) => this.setState({ pf: 'closed', pfSend: false, hl: idx === 0 ? 'yes' : 'no' }),
      isSim: tab === 'sim', isStage: tab === 'stage',
      tabSim: () => this.setState({ tab: 'sim' }), tabStage: () => this.setState({ tab: 'stage' }),
      // tab แบบ CI (.tt / .tt.on ใน helmet · §11.6) + คีย์ลูกศรซ้ายขวา/Home/End สลับ tab (roving tabindex)
      simCls: tab === 'sim' ? 'tt on' : 'tt', stageCls: tab === 'stage' ? 'tt on' : 'tt',
      simTi: tab === 'sim' ? '0' : '-1', stageTi: tab === 'stage' ? '0' : '-1',
      tabKey: (e) => {
        try {
          const k = e && e.key;
          if (k !== 'ArrowLeft' && k !== 'ArrowRight' && k !== 'Home' && k !== 'End') return;
          let nxt = tab === 'sim' ? 'stage' : 'sim';
          if (k === 'Home') nxt = 'sim';
          else if (k === 'End') nxt = 'stage';
          if (e.preventDefault) e.preventDefault();
          this.setState({ tab: nxt });
          const el = document.getElementById('ma2t-' + nxt);
          if (el) el.focus();
        } catch (err) {}
      },
      pillText, pillIcon, pillIconClass, pillStyle,
      contentStyle: 'position:absolute;left:0;top:' + HEAD_H + 'px;width:680px;height:' + contentH + 'px',
      contentH: String(contentH),
      circuit, run,
      pressedFlag: pressed ? 'yes' : 'no',
      pot: String(S.pot !== undefined ? S.pot : 512),
      ledState,
      press: () => this.setState({ pressed: true, ever: true }),
      release: () => this.setState({ pressed: false }),
      kd: (e) => { if (e && (e.key === ' ' || e.key === 'Enter')) { if (e.preventDefault) e.preventDefault(); this.setState({ pressed: true, ever: true }); } },
      ku: (e) => { if (e && (e.key === ' ' || e.key === 'Enter')) this.setState({ pressed: false }); },
      onPot: (e) => this.setState({ pot: Number(e && e.target ? e.target.value : 512) }),
      stagePose: String(ever ? 2 : 1),
      stageState: run === 'running' ? 'running' : 'idle',
      frozenText: run === 'broken' ? (circuit === 'short' ? 'หยุดอยู่ เพราะสายลัดวงจร' : 'หยุดอยู่ เพราะ LED เสีย') : '',
      hasBannerShow: hasBanner && !hideMode, hasBannerHide: hasBanner && hideMode,
      bannerText, bannerCode, bannerButton, bannerIcon, bannerIconClass, bannerAction,
      bannerStyleShow: 'position:absolute;left:8px;top:' + bannerTop + 'px;width:664px;height:64px;' + bannerCommon,
      // มุมขวาล่างของพื้นที่ต่อบล็อก (แผงที่ 1): ล่างแถบ = ขอบล่างแผง (72 + wsH) − (ขอบ 8 + ปุ่มเลิกทำ/ซูม ≈ 50 + ช่อง 8) − สูงแถบ 64 → top = wsH − 58 · ขวา = ขอบแผง 1416 − 12 − กว้าง 600 → left 804
      // ชุดที่ 5: ชุดปุ่มเลื่อน/ซูมแนวตั้ง (56×257) อยู่มุมขวาล่างของแผง (ซ้ายสุด x1344) → แถบแจ้งกว้าง 560 ชิดขวาที่ x1336 (ห่าง 8) · ล่างแถบ = ล่างแผง − 16 (top = 72 + wsH − 16 − 64) · เดิมกว้าง 600 left 804 เหนือกลุ่มปุ่มแนวนอน
      bannerStyleHide: 'position:absolute;left:776px;top:' + (wsH - 8) + 'px;width:560px;height:64px;' + bannerCommon,
      cardOn: !!cm, cardKind: cm ? cm[0] : 'success', cardStage: cm ? cm[1] : 'no', cardWhy: cm ? cm[2] : 'usb',
      // การ์ดสถานะ = toast (z 50): ขวา 36 (ขอบกรอบ 24 + 12) · เหนือแผงลิ้นชัก 8
      // ชุดที่ 5: เว้นชุดปุ่มเลื่อน/ซูมมุมขวาล่าง (กว้าง 56 + ห่าง 16 + เว้น 16) → ขวา 108
      cardStyle: 'position:absolute;right:' + (hideMode ? 108 : 36) + 'px;bottom:' + (900 - rowTop + 8) + 'px;z-index:50',
      // ฉากหลัง dialog (z-backdrop 20) + ชั้น dialog (z-dialog 30 · ไม่รับเมาส์ ยกเว้นตัว dialog) · สูงถึงขอบบนแผงลิ้นชัก
      backdropStyle: 'position:absolute;left:0;top:0;width:1440px;height:' + rowTop + 'px;background:rgba(20,36,61,.35);z-index:20',
      dlgWrapStyle: 'position:absolute;left:0;top:0;width:1440px;height:' + rowTop + 'px;display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:none',
      dialogOn: dialog === 'warn' || dialog === 'guardRun' || dialog === 'guardSend', dialogKind: (dialog === 'warn' || dialog === 'guardRun' || dialog === 'guardSend') ? dialog : 'warn'
    };
  }
}
</script>
