<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>บล็อก A2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
.ba-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ba-dp{box-sizing:border-box;display:flex;align-items:center;gap:4px;margin:0;padding:0 8px;border:0;border-radius:8px;color:#14243D;font-family:inherit;font-size:16px;font-weight:600;line-height:20px;white-space:nowrap;text-align:left}
.ba-dp>*{flex-shrink:0}
button.ba-dp{cursor:pointer}
button.ba-dp::after{content:"";position:absolute;left:-6px;right:-6px;top:-8px;bottom:-8px}
.ba-ct{position:absolute;margin:0;padding:0;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer;font-family:inherit}
/* ช่องติ๊ก (OQ181 · "ยอมให้ใส่คำสั่ง" ในกล่องเฟืองฟังก์ชัน): ช่อง 28 ขาว ขอบ 2px #14243D · พื้นที่กด 44 · ติ๊ก = ✓ เข้ม */
.ba-ck{position:absolute;box-sizing:border-box;margin:0;padding:0;display:flex;align-items:center;justify-content:center;border:2px solid #14243D;border-radius:8px;background:#FFFFFF;color:#14243D;cursor:pointer;font-family:inherit}
.ba-ck::after{content:"";position:absolute;left:-8px;right:-8px;top:-8px;bottom:-8px}
/* R21 (2026-10-30): วงโฟกัส 2 ชั้น = ขาว 2px + น้ำเงิน #1866C9 3px · น้ำเงินบนพื้นหมวดต่ำกว่า 3:1 หลายหมวด (ชมพู 2.45 · เซอร์โว 2.36 · เซนเซอร์ 2.96) แต่ติดกับวงขาว 5.55:1 ทุกหมวด · ปุ่ม dropdown/ช่องติ๊ก = ขาว (box-shadow) ชิดในของ outline offset 2 · ปุ่มควบคุมกลม (เฟือง/?/±) = วงขาว+น้ำเงินรอบวงกลม 28 */
button.ba-dp:focus-visible,button.ba-ck:focus-visible{outline:3px solid #1866C9;outline-offset:2px;box-shadow:0 0 0 2px #FFFFFF}
button.ba-ct:focus-visible{outline:none}
button.ba-ct:focus-visible>span{box-shadow:0 0 0 2px #FFFFFF,0 0 0 5px #1866C9}
input.ba-in:focus{outline:none}
input.ba-in.kb:focus{outline:none;border-color:#1866C9!important;border-width:2px!important;border-style:solid!important;box-shadow:0 0 0 3px #D0EBFD}
/* tooltip CI (brand §11.8): พื้น #14243D ตัวขาว 14/500 radius 8 z-popover 40 · ใต้ปุ่ม · ขึ้นตอน hover และ focus-visible */
.ba-tip::after{content:attr(data-tip);display:none;position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 8px);z-index:40;padding:4px 12px;border-radius:8px;background:#14243D;color:#FFFFFF;font-size:14px;font-weight:500;line-height:1.6;white-space:nowrap;text-align:left;pointer-events:none}
.ba-tip:hover::after,.ba-tip:focus-visible::after{display:block}
</style>
</helmet>
<!-- BlockA2 · component บล็อกเวอร์ชันใหม่ชิ้นเดียว (A2 รอบ 8 · ชุดที่ 4 · OQ107 · R2 (13)) · ไม่ทับของเดิม (บอร์ด A วาดบล็อกในไฟล์ BlocksPane เอง ไม่มี component บล็อก)
     ใช้ได้ 2 แบบ:
     (ก) ตัวอย่างเดี่ยว (ไม่ส่ง items): คำนวณขนาดเองจาก prop text · kind · cat · state · [ค่า] = ช่องค่าแคปซูลขาว · () = ช่องเงื่อนไขหกเหลี่ยมว่าง · {ชื่อ} = dropdown อุปกรณ์ · hat ใช้ chip + icon
     (ข) ในบอร์ด A2 (BlocksPaneA2 ส่ง w h bars mouths tab hd items): BlocksPaneA2 เป็นผู้คำนวณเรขาคณิตทั้งหมด (วัดข้อความ · ตำแหน่งช่อง · บล็อกซ้อนกัน · เกาะ) ส่งมาเป็นข้อมูล · ไฟล์นี้เป็นเจ้าของ "หน้าตา" ทั้งหมด: รูปทรง (หัวโดม · ปากตัว C · รอยบาก · แคปซูล · หกเหลี่ยม) · สีพื้น/ขอบ 16 หมวด · ตัวอักษรเข้ม text-primary #14243D 700 16px (รอบ 9 · คืนตัวเข้ม OQ135 · ยกเลิกตัวขาว/DSG-19 · ≥ 6.5:1 ทุกหมวด) · ช่องขาว/dropdown · สถานะ normal / disabled / ghost / warn
     ข้อจำกัด (ตรงไปตรงมา): dc ไม่ให้ไฟล์หนึ่ง import โค้ดของอีกไฟล์ → ตรรกะวัดขนาด/จัดตำแหน่งอยู่ที่ BlocksPaneA2 (แหล่งเดียวของเรขาคณิตในบอร์ด) · โหมด (ก) มีตัววัด/จัดตำแหน่งแถวเดียวของตัวเองเฉพาะดูตัวอย่าง (ซ้ำกับของ BlocksPaneA2 บางส่วน) ถ้าสองที่ไม่ตรงกัน บอร์ดใช้ของ BlocksPaneA2 -->
<div aria-hidden="{{ah}}" onPointerDownCapture="{{mPtr}}" onKeyDownCapture="{{mKey}}" style="position:relative;width:{{rootW}}px;height:{{rootH}}px;pointer-events:none;color:#14243D;font-family:'IBM Plex Sans Thai',system-ui,sans-serif">
  <svg width="{{sw}}" height="{{sh}}" aria-hidden="true" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none">
    <path d="{{shapeD}}" fill="{{fill}}" stroke="{{stroke}}" stroke-width="{{swid}}" stroke-linejoin="round" stroke-dasharray="{{dash}}" onPointerDown="{{down}}" onContextMenu="{{ctxm}}" style="pointer-events:{{pe}};cursor:{{cur}};touch-action:none"></path>
  </svg>
  <sc-for list="{{its}}" as="it" hint-placeholder-count="0">
    <sc-if value="{{it.isText}}" hint-placeholder-val="{{false}}"><span style="{{it.st}}">{{it.t}}</span></sc-if>
    <sc-if value="{{it.isIcon}}" hint-placeholder-val="{{false}}"><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="{{it.st}}"><path d="{{it.d}}"></path></svg></sc-if>
    <sc-if value="{{it.isChip}}" hint-placeholder-val="{{false}}"><span style="{{it.st}}"><sc-if value="{{it.chk}}" hint-placeholder-val="{{false}}"><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M5 12l5 5L20 7"></path></svg></sc-if>{{it.t}}</span></sc-if>
    <sc-if value="{{it.isHole}}" hint-placeholder-val="{{false}}"><svg width="{{it.w}}" height="{{it.h}}" aria-hidden="true" style="position:absolute;left:{{it.x}}px;top:{{it.y}}px;overflow:visible;pointer-events:none"><path d="{{it.d}}" fill="{{it.fill}}"></path></svg></sc-if>
    <sc-if value="{{it.isSlotS}}" hint-placeholder-val="{{false}}"><span style="{{it.st}}">{{it.t}}</span></sc-if>
    <sc-if value="{{it.isSlotL}}" hint-placeholder-val="{{false}}"><input class="{{it.cls}}" value="{{it.value}}" onChange="{{it.change}}" onFocus="{{it.focus2}}" aria-label="{{it.aria}}" style="{{it.st}}"></sc-if>
    <sc-if value="{{it.isDevS}}" hint-placeholder-val="{{false}}"><span class="ba-dp" style="{{it.st}}"><sc-if value="{{it.hasSw}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{it.swSt}}"></span></sc-if><sc-if value="{{it.noSw}}" hint-placeholder-val="{{true}}"><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="{{it.ic}}"></path></svg></sc-if><span>{{it.t}}</span><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="width:10px;height:10px;stroke-width:3.5"><path d="M6 9l6 6 6-6"></path></svg></span></sc-if>
    <sc-if value="{{it.isDevL}}" hint-placeholder-val="{{false}}"><button class="ba-dp" onClick="{{it.open}}" onPointerDown="{{stop}}" aria-haspopup="listbox" aria-expanded="{{it.exp}}" aria-label="{{it.aria}}" style="{{it.st}}"><sc-if value="{{it.hasSw}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{it.swSt}}"></span></sc-if><sc-if value="{{it.noSw}}" hint-placeholder-val="{{true}}"><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="{{it.ic}}"></path></svg></sc-if><span>{{it.t}}</span><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="width:10px;height:10px;stroke-width:3.5"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if>
    <sc-if value="{{it.isChkL}}" hint-placeholder-val="{{false}}"><button type="button" class="ba-ck" role="checkbox" aria-checked="{{it.on}}" aria-label="{{it.aria}}" onClick="{{it.click}}" onPointerDown="{{stop}}" style="{{it.st}}"><sc-if value="{{it.on}}" hint-placeholder-val="{{false}}"><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;stroke-width:3.2"><path d="M5 12l5 5L20 7"></path></svg></sc-if></button></sc-if>
    <sc-if value="{{it.isChkS}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{it.st}}"><sc-if value="{{it.on}}" hint-placeholder-val="{{false}}"><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;stroke-width:3.2"><path d="M5 12l5 5L20 7"></path></svg></sc-if></span></sc-if>
    <sc-if value="{{it.isSolS}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{it.st}}"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;flex-shrink:0"><path d="{{it.sd}}" fill="{{it.sfill}}" fill-rule="evenodd" stroke="{{it.sstroke}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></sc-if>
    <sc-if value="{{it.isSolL}}" hint-placeholder-val="{{false}}"><button type="button" class="ba-ct ba-tip" data-tip="{{it.aria}}" onClick="{{it.click}}" onPointerDown="{{stop}}" aria-haspopup="{{it.hasPop}}" aria-expanded="{{it.exp}}" aria-label="{{it.aria}}" style="{{it.stb}}"><span style="{{it.st}}"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;flex-shrink:0"><path d="{{it.sd}}" fill="{{it.sfill}}" fill-rule="evenodd" stroke="{{it.sstroke}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button></sc-if>
    <sc-if value="{{it.isCtlS}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{it.st}}"><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="{{it.ic}}"></path></svg></span></sc-if>
    <sc-if value="{{it.isCtlL}}" hint-placeholder-val="{{false}}"><button class="ba-ct ba-tip" data-tip="{{it.aria}}" onClick="{{it.click}}" aria-label="{{it.aria}}" style="{{it.st}}"><span style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;box-sizing:border-box;border:1.5px solid currentColor;border-radius:50%"><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="{{it.ic}}"></path></svg></span></button></sc-if>
    <sc-if value="{{it.isCtlG}}" hint-placeholder-val="{{false}}"><button class="ba-ct ba-tip" data-tip="{{it.aria}}" onClick="{{it.click}}" onPointerDown="{{stop}}" aria-haspopup="dialog" aria-expanded="{{it.exp}}" aria-label="{{it.aria}}" style="{{it.st}}"><span style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;box-sizing:border-box;border:1.5px solid currentColor;border-radius:50%"><svg class="ba-i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="{{it.ic}}"></path></svg></span></button></sc-if>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"stack","options":["hat","stack","c","value","boolean"],"section":"บล็อก"},"cat":{"editor":"int","default":2,"min":1,"max":16,"section":"บล็อก"},"text":{"editor":"text","default":"รอ [200] ms","section":"บล็อก"},"chip":{"editor":"text","default":"","section":"บล็อก"},"icon":{"editor":"enum","default":"flag","options":["flag","loop"],"section":"บล็อก"},"state":{"editor":"enum","default":"normal","options":["normal","disabled","ghost","warn"],"section":"บล็อก"},"bw":{"editor":"float","default":1.5,"min":1,"max":3,"step":0.5,"section":"ขอบ"},"w":{"editor":null},"h":{"editor":null},"bars":{"editor":null},"mouths":{"editor":null},"tab":{"editor":null},"hd":{"editor":null},"items":{"editor":null},"down":{"editor":null},"ctx":{"editor":null},"stop":{"editor":null},"decor":{"editor":null},"$preview":{"width":260,"height":120}}'>
class Component extends DCLogic {
  componentDidMount() {
    // โหมดตัวอย่างเดี่ยววัดข้อความด้วย canvas ต้องรอฟอนต์โหลดแล้ววาดใหม่ (โหมดในบอร์ดไม่ใช้ตัววัดนี้)
    const re = () => { if (Array.isArray(this.gp('items'))) return; this._mc = {}; try { this.forceUpdate(); } catch (e) {} };
    try {
      if (document.fonts && document.fonts.load) {
        document.fonts.load("700 16px 'IBM Plex Sans Thai'", 'กขคเริ่มต้น').then(re, () => {});
        document.fonts.load("600 16px 'IBM Plex Sans Thai'", 'กขคเริ่มต้น').then(re, () => {});
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(re);
    } catch (e) {}
  }
  gp(name) {
    const P = this.props || {};
    const kebab = name.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase());
    if (P[name] !== undefined) return P[name];
    if (P[name.toLowerCase()] !== undefined) return P[name.toLowerCase()];
    if (P[kebab] !== undefined) return P[kebab];
    return undefined;
  }
  // R=มุม NX=ตำแหน่งรอยบาก ND=ลึกรอยบาก A=ย่อหน้าปาก HD=ความสูงโดมหัว SH=สูงช่อง PX=padding แนวนอน IG=ช่องว่างระหว่างชิ้นในแถว
  K() { return { R: 7, NX: 14, ND: 5, A: 18, HD: 22, SH: 28, PX: 12, IG: 8 }; }
  // 16 หมวด [พื้น, ขอบ] (DSG-13 ชั่วคราว) · ข้อ 1.1 (2026-10-28): เรียงตามหมวดใหม่ R18 (15 หมวด 3 กลุ่ม + ตัวละคร) ลำดับเดียวกับ CatRailA2/BlocksPaneA2
  // 1 เริ่มต้น 2 ควบคุม 3 ตรรกะ 4 คณิต 5 ข้อความ · 6 ตัวแปร 7 รายการ 8 ฟังก์ชัน · 9 (ว่าง · ถอด Arm Control 2026-11-02 · ช่องสีเทากันพัง ไม่มีหมวดใช้) 10 Car Control 11 มอเตอร์ (เดิม Servo / Motor · OQ193) 12 Sensor 13 Display 14 Serial 15 Remote Control · 16 ตัวละคร
  CATS() {
    return [
      ['#FFD23F', '#9C7A00'], ['#FFAB3D', '#A8610A'], ['#62D4C8', '#137A70'], ['#6CCB5F', '#2F7A26'],
      ['#B79CFF', '#5F3FC2'], ['#FF8F70', '#B03A1C'], ['#FF86A8', '#B02C57'], ['#F08AD3', '#9A2F85'],
      ['#DCE3EC', '#5A6377'], ['#D58CF2', '#8239A8'], ['#5BAEFF', '#1D63B8'], ['#5CCBEA', '#17789A'],
      ['#7FE0A8', '#1F8050'], ['#8FA6FF', '#3D4FC0'], ['#D2A679', '#7A4E1F'], ['#FFBE94', '#A4521C']
    ];
  }
  tw(t, wt) {
    this._mc = this._mc || {};
    const w0 = wt || 700;
    const s = String(t);
    const key = w0 + '|' + s;
    if (this._mc[key] !== undefined) return this._mc[key];
    let w = s.length * 9;
    try {
      if (!this._cx) this._cx = document.createElement('canvas').getContext('2d');
      this._cx.font = w0 + " 16px 'IBM Plex Sans Thai', system-ui, sans-serif";
      w = this._cx.measureText(s).width;
    } catch (e) {}
    this._mc[key] = Math.ceil(w);
    return this._mc[key];
  }

  /* ---------- รูปทรง (Tinkercad: หัวโดมมน · ปากตัว C มีรอยบากรับบล็อกถัดไป · แคปซูล · หกเหลี่ยม) ---------- */
  // hat: โดมครึ่งวงรีกว้าง ≤132 สูง hd เหนือแถบหัว (ค่าประมาณจากสายตา · ผู้ใช้ยังไม่ส่งไฟล์ภาพให้วัด OQ108) · อื่น ๆ: มุม 7 + รอยบากบน
  topD(w, hat, hd) {
    const K = this.K(), R = K.R, NX = K.NX, ND = K.ND;
    // hd = 0: บล็อกครอบหัวแบน (กล่อง "ค่าที่รับ" ในกล่องเฟือง · ไม่มีโดม ไม่มีรอยบาก · มุมซ้ายบนเหลี่ยมแบบ Mixly)
    if (hat && hd === 0) return 'M0,0 H' + (w - R) + ' A' + R + ',' + R + ' 0 0 1 ' + w + ',' + R;
    if (hat) {
      const dw = Math.min(132, Math.round(w * 0.62));
      return 'M0,' + hd + ' A' + (dw / 2) + ',' + hd + ' 0 0 1 ' + dw + ',' + hd + ' H' + (w - R) + ' A' + R + ',' + R + ' 0 0 1 ' + w + ',' + (hd + R);
    }
    return 'M0,' + R + ' A' + R + ',' + R + ' 0 0 1 ' + R + ',0 H' + NX + ' l4,' + ND + ' h16 l4,-' + ND + ' H' + (w - R) + ' A' + R + ',' + R + ' 0 0 1 ' + w + ',' + R;
  }
  botD(w, y, tab) {
    const K = this.K(), R = K.R, NX = K.NX, ND = K.ND;
    return ' V' + (y - R) + ' A' + R + ',' + R + ' 0 0 1 ' + (w - R) + ',' + y + (tab ? ' H' + (NX + 24) + ' l-4,' + ND + ' h-16 l-4,-' + ND : '') + ' H' + R + ' A' + R + ',' + R + ' 0 0 1 0,' + (y - R) + ' Z';
  }
  stackD(w, h, tab) { return this.topD(w, false, 0) + this.botD(w, h, tab); }
  // บล็อกครอบ (c / hat): bars = ความสูงแต่ละแถบ (hat: แถบแรกรวมโดม) · mouths = ความสูงปากระหว่างแถบ
  cD(W, bars, mouths, hat, tab, hd) {
    const K = this.K(), R = K.R, NX = K.NX, ND = K.ND, A = K.A;
    let d = this.topD(W, hat, hd), y = 0;
    bars.forEach((bh, k) => {
      const yb = y + bh;
      if (k < mouths.length) {
        const mh = mouths[k];
        d += ' V' + (yb - R) + ' A' + R + ',' + R + ' 0 0 1 ' + (W - R) + ',' + yb;
        d += ' H' + (A + NX + 24) + ' l-4,' + ND + ' h-16 l-4,-' + ND + ' H' + (A + R) + ' A' + R + ',' + R + ' 0 0 0 ' + A + ',' + (yb + R);
        d += ' V' + (yb + mh - R) + ' A' + R + ',' + R + ' 0 0 0 ' + (A + R) + ',' + (yb + mh);
        d += ' H' + (A + NX) + ' l4,' + ND + ' h16 l4,-' + ND + ' H' + (W - R) + ' A' + R + ',' + R + ' 0 0 1 ' + W + ',' + (yb + mh + R);
        y = yb + mh;
      } else {
        d += this.botD(W, yb, tab);
      }
    });
    return d;
  }
  pillD(w, h) { const r = h / 2; return 'M' + r + ',0 H' + (w - r) + ' A' + r + ',' + r + ' 0 0 1 ' + (w - r) + ',' + h + ' H' + r + ' A' + r + ',' + r + ' 0 0 1 ' + r + ',0 Z'; }
  hexD(w, h) { const r = h / 2; return 'M' + r + ',0 H' + (w - r) + ' L' + w + ',' + r + ' L' + (w - r) + ',' + h + ' H' + r + ' L0,' + r + ' Z'; }

  /* ---------- โหมดตัวอย่างเดี่ยว: แยก text เป็นชิ้น · วัด · จัดตำแหน่งแถวเดียว ---------- */
  parse(text) {
    const out = [];
    String(text || '').split(/(\[[^\]]*\]|\([^)]*\)|\{[^}]*\})/).forEach((s) => {
      if (!s) return;
      const c0 = s.charAt(0);
      if (c0 === '[') out.push({ t: 'slot', v: s.substring(1, s.length - 1) });
      else if (c0 === '(') out.push({ t: 'hole' });
      else if (c0 === '{') out.push({ t: 'dev', v: s.substring(1, s.length - 1) });
      else { const v = s.trim(); if (v) out.push({ t: 'x', v: v }); }
    });
    return out;
  }
  solo(kind) {
    const K = this.K(), SH = K.SH;
    const hat = kind === 'hat';
