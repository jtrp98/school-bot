<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>1D · Block Studio 1C – เมนูตาม Mixly</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&amp;family=Noto+Sans+Thai:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1866C9}a:hover{color:#0F4C99}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
</style>
</helmet>
<div ref="{{rootRef}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" onPointerDown="{{onRootDown}}" style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #FFFFFF; color: #14243D; font-family: 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif; overflow: hidden; position: relative; user-select: none">

  <svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><pattern id="sbHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#E4E7EC"></rect><path d="M0 0 L0 7" stroke="#EDF0F4" stroke-width="3"></path></pattern></defs></svg>

  <!-- Top bar -->
  <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 20px; padding: 0 20px; border-bottom: 2px solid #EEF1F5; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #1866C9; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V4M9.5 13h.01M14.5 13h.01M10 16h4"></path></svg>
      </div>
      <span style="font-family: 'Mitr', sans-serif; font-weight: 600; font-size: 20px">School Bot</span>
    </div>
    <nav aria-label="สลับโปรแกรม" style="display: flex; background: #F1F4F8; border-radius: 12px; padding: 4px; gap: 4px">
      <button style="height: 40px; padding: 0 16px; border: none; border-radius: 9px; background: transparent; color: #5A6377; font-size: 15px; font-weight: 600">แขนกล</button>
      <button aria-current="page" style="height: 40px; padding: 0 16px; border: 2px solid #1866C9; border-radius: 9px; background: #FFFFFF; color: #1866C9; font-size: 15px; font-weight: 700">บล็อก</button>
    </nav>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 0">
      <span style="font-size: 16px; font-weight: 600">กดปุ่มแล้วแขนเล่นท่า</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5A6377">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
        บันทึกไฟล์ในคอมแล้ว
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button onClick="{{undo}}" disabled="{{noUndo}}" aria-label="เลิกทำ" style="width: 44px; height: 44px; border: 2px solid #DCE3EC; border-bottom-width: 4px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; opacity: {{undoOp}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14243D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
      <button onClick="{{redo}}" disabled="{{noRedo}}" aria-label="ทำซ้ำ" style="width: 44px; height: 44px; border: 2px solid #DCE3EC; border-bottom-width: 4px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; opacity: {{redoOp}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14243D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
      <div style="width: 2px; height: 28px; background: #EEF1F5; margin: 0 4px"></div>
      <button style="height: 44px; padding: 0 14px 0 12px; border: 2px solid #DCE3EC; border-bottom-width: 4px; border-radius: 12px; background: {{robotChipBg}}; display: flex; align-items: center; gap: 10px; text-align: left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14243D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"></path></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.15">
          <span style="font-size: 14px; font-weight: 700">{{robotName}}</span>
          <span style="font-size: 12px; color: #5A6377; display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{robotDot}}"></span>{{robotSub}}</span>
        </span>
      </button>
      <sc-if value="{{showConnect}}" hint-placeholder-val="{{false}}">
        <button style="height: 44px; padding: 0 16px; border: none; border-bottom: 4px solid #0F4C99; border-radius: 12px; background: #1866C9; color: #FFFFFF; font-size: 15px; font-weight: 700">เชื่อมต่อหุ่น</button>
      </sc-if>
      <button aria-label="เมนูครู (ต้องใส่รหัส)" style="width: 44px; height: 44px; border: 2px solid #DCE3EC; border-bottom-width: 4px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14243D" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
  </header>

  <!-- Mission strip -->
  

  

  <!-- Bottom bar -->
  <div style="flex: 1; min-height: 0; display: flex">

    <!-- Menu list -->
    <nav aria-label="เมนูบล็อก" style="width: 204px; flex-shrink: 0; border-right: 2px solid #EEF1F5; background: #FAFBFD; display: flex; flex-direction: column; gap: 3px; padding: 10px; box-sizing: border-box; overflow: auto">
      <button aria-label="ค้นหาบล็อก" style="height: 40px; flex-shrink: 0; border: 2px solid #DCE3EC; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #5A6377; font-size: 14px; font-weight: 600; margin-bottom: 4px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        ค้นหาบล็อก
      </button>
      <sc-for list="{{menus}}" as="m" hint-placeholder-count="14">
        <button onClick="{{m.pick}}" aria-pressed="{{m.selected}}" style="height: 38px; flex-shrink: 0; border: 2px solid {{m.border}}; border-radius: 10px; background: {{m.bg}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left">
          <span style="width: 14px; height: 14px; flex-shrink: 0; border-radius: 4px; background: {{m.color}}; border-bottom: 3px solid {{m.edge}}"></span>
          <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: {{m.weight}}; color: #14243D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.name}}</span>
          <span style="font-size: 12px; color: #5A6377">{{m.count}}</span>
        </button>
        <sc-if value="{{m.divider}}" hint-placeholder-val="{{false}}"><div style="height: 2px; flex-shrink: 0; background: #E4E9F0; margin: 4px 2px"></div></sc-if>
      </sc-for>
    </nav>

    <!-- Palette (drop here to delete) -->
    <aside ref="{{palRef}}" aria-label="บล็อกในเมนู" style="width: 424px; flex-shrink: 0; border-right: 2px solid #EEF1F5; display: flex; flex-direction: column; min-height: 0; position: relative">
      <div style="padding: 14px 18px 8px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Mitr', sans-serif; font-size: 20px; font-weight: 500">{{paletteTitle}}</span>
        <span style="font-size: 13px; color: #5A6377">{{paletteSub}}</span>
      </div>
      <div style="flex: 1; min-height: 0; overflow: auto">
        <sc-if value="{{showFavEmpty}}" hint-placeholder-val="{{false}}">
          <div style="margin: 8px 18px; padding: 24px 18px; border: 2px dashed #F5C66B; border-radius: 16px; background: #FFFBF2; text-align: center; font-size: 14px; color: #5A6377; line-height: 1.55">ยังไม่มีบล็อกโปรด แตะรูปดาวข้างบล็อกที่ใช้บ่อย</div>
        </sc-if>
        <div ref="{{palInRef}}" style="position: relative; width: {{palW}}px; height: {{palH}}px">
          <sc-for list="{{palPieces}}" as="p" hint-placeholder-count="0">
            <sc-if value="{{p.isPath}}" hint-placeholder-val="{{false}}"><svg width="{{p.sw0}}" height="{{p.sh0}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; overflow: visible; pointer-events: none; opacity: {{p.op}}"><path d="{{p.d}}" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="{{p.swid}}" onPointerDown="{{p.down}}" style="pointer-events: {{p.pe}}; cursor: {{p.cur}}; touch-action: none"></path></svg></sc-if>
            <sc-if value="{{p.isText}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; height: {{p.h}}px; line-height: {{p.h}}px; font-size: 14px; font-weight: 400; color: {{p.color}}; white-space: nowrap; pointer-events: none; opacity: {{p.op}}">{{p.t}}</span></sc-if>
            <sc-if value="{{p.isInput}}" hint-placeholder-val="{{false}}"><input value="{{p.value}}" onChange="{{p.change}}" onFocus="{{p.focus}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.w}}px; height: {{p.h}}px; box-sizing: border-box; padding: 0 4px; margin: 0; border: {{p.border}}; border-radius: 999px; background: {{p.bg}}; color: {{p.color}}; font: 400 14px 'Noto Sans Thai', Tahoma, sans-serif; text-align: center; user-select: text"></sc-if>
            <sc-if value="{{p.isDrop}}" hint-placeholder-val="{{false}}"><button onClick="{{p.open}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.w}}px; height: {{p.h}}px; box-sizing: border-box; padding: 0 6px; margin: 0; border: {{p.border}}; border-radius: {{p.radius}}; background: {{p.bg}}; color: {{p.color}}; font-size: 14px; font-weight: 400; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 4px">{{p.t}}<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="{{p.color}}" stroke-width="3.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if>
            <sc-if value="{{p.isBtn}}" hint-placeholder-val="{{false}}"><button onClick="{{p.click}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.w}}px; height: {{p.h}}px; box-sizing: border-box; padding: 0; margin: 0; border-radius: 50%; border: 2px solid {{p.color}}; background: transparent; color: {{p.color}}; font-size: 16px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; opacity: {{p.op}}">{{p.t}}</button></sc-if>
            <sc-if value="{{p.isStar}}" hint-placeholder-val="{{false}}"><button onClick="{{p.click}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 44px; height: 44px; padding: 0; margin: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></button></sc-if>
          </sc-for>
        </div>
      </div>
      <sc-if value="{{overPal}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; inset: 0; background: rgba(140, 22, 22, 0.86); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #FFFFFF; pointer-events: none">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
          <span style="font-size: 18px; font-weight: 700">ปล่อยเพื่อลบบล็อก</span>
        </div>
      </sc-if>
    </aside>

    <!-- Code panel -->
    <sc-if value="{{codeOpen}}" hint-placeholder-val="{{false}}">
      <section aria-label="โค้ด Python" style="width: 380px; flex-shrink: 0; border-right: 2px solid #EEF1F5; background: #F7F9FC; display: flex; flex-direction: column">
        <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 18px; border-bottom: 2px solid #EEF1F5">
          <span style="font-size: 16px; font-weight: 700">โค้ด Python</span>
          <span style="font-size: 12px; font-weight: 700; color: #5A6377; background: #E9EDF3; border-radius: 6px; padding: 2px 8px">อ่านอย่างเดียว</span>
          <span style="flex: 1"></span>
          <button onClick="{{toggleCode}}" aria-label="ซ่อนโค้ด" style="width: 40px; height: 40px; border: none; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6377" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
        </div>
        <div style="flex: 1; overflow: auto; padding: 14px 0; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; line-height: 1.75">
          <sc-for list="{{codeLines}}" as="l" hint-placeholder-count="10">
            <div style="display: flex; background: {{l.bg}}"><span style="width: 36px; flex-shrink: 0; text-align: right; color: #9AA3B5; padding-right: 12px">{{l.n}}</span><span style="white-space: pre; color: {{l.color}}">{{l.text}}</span></div>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <!-- Workspace -->
    <main ref="{{wsRef}}" aria-label="พื้นที่ต่อบล็อก" style="flex: 1; min-width: 0; position: relative; background-color: #FFFFFF; background-image: radial-gradient(#DCE3EC 1.3px, transparent 1.3px); background-size: 24px 24px; overflow: hidden; touch-action: none">
      <sc-for list="{{wsPieces}}" as="p" hint-placeholder-count="0">
            <sc-if value="{{p.isPath}}" hint-placeholder-val="{{false}}"><svg width="{{p.sw0}}" height="{{p.sh0}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; overflow: visible; pointer-events: none; opacity: {{p.op}}"><path d="{{p.d}}" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="{{p.swid}}" onPointerDown="{{p.down}}" style="pointer-events: {{p.pe}}; cursor: {{p.cur}}; touch-action: none"></path></svg></sc-if>
            <sc-if value="{{p.isText}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; height: {{p.h}}px; line-height: {{p.h}}px; font-size: 14px; font-weight: 400; color: {{p.color}}; white-space: nowrap; pointer-events: none; opacity: {{p.op}}">{{p.t}}</span></sc-if>
            <sc-if value="{{p.isInput}}" hint-placeholder-val="{{false}}"><input value="{{p.value}}" onChange="{{p.change}}" onFocus="{{p.focus}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.w}}px; height: {{p.h}}px; box-sizing: border-box; padding: 0 4px; margin: 0; border: {{p.border}}; border-radius: 999px; background: {{p.bg}}; color: {{p.color}}; font: 400 14px 'Noto Sans Thai', Tahoma, sans-serif; text-align: center; user-select: text"></sc-if>
            <sc-if value="{{p.isDrop}}" hint-placeholder-val="{{false}}"><button onClick="{{p.open}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.w}}px; height: {{p.h}}px; box-sizing: border-box; padding: 0 6px; margin: 0; border: {{p.border}}; border-radius: {{p.radius}}; background: {{p.bg}}; color: {{p.color}}; font-size: 14px; font-weight: 400; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 4px">{{p.t}}<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="{{p.color}}" stroke-width="3.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if>
            <sc-if value="{{p.isBtn}}" hint-placeholder-val="{{false}}"><button onClick="{{p.click}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.w}}px; height: {{p.h}}px; box-sizing: border-box; padding: 0; margin: 0; border-radius: 50%; border: 2px solid {{p.color}}; background: transparent; color: {{p.color}}; font-size: 16px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; opacity: {{p.op}}">{{p.t}}</button></sc-if>
            <sc-if value="{{p.isStar}}" hint-placeholder-val="{{false}}"><button onClick="{{p.click}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 44px; height: 44px; padding: 0; margin: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></button></sc-if>
          </sc-for>
      <div style="position: absolute; top: 14px; right: 16px">
        <button onClick="{{toggleCode}}" aria-pressed="{{codeOpen}}" style="height: 44px; padding: 0 14px; border: 2px solid #DCE3EC; border-bottom-width: 4px; border-radius: 12px; background: #FFFFFF; color: #14243D; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14243D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"></path></svg>
          {{codeBtnLabel}}
        </button>
      </div>
      <div style="position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px">
        <button ref="{{trashRef}}" aria-label="ถังขยะ ลากบล็อกมาวางเพื่อลบ" style="width: 52px; height: 60px; border: 2px solid {{trashBorder}}; border-bottom-width: 4px; border-radius: 14px; background: {{trashBg}}; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{trashIcon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
      </div>
      <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
        <div role="status" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; background: #14243D; color: #FFFFFF; border-radius: 14px; padding: 10px 10px 10px 18px; font-size: 15px; font-weight: 600; white-space: nowrap">
          {{toastText}}
          <button onClick="{{undoToast}}" onPointerDown="{{stopEv}}" style="height: 40px; padding: 0 14px; border: none; border-radius: 10px; background: #2A3D5C; color: #9CC3F0; font-size: 15px; font-weight: 700">เลิกทำ</button>
        </div>
      </sc-if>
    </main>
  </div><footer style="height: 84px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-top: 2px solid #EEF1F5; box-sizing: border-box">
    <button disabled="{{stopDisabled}}" style="height: 56px; padding: 0 22px; border: none; border-bottom: 4px solid #A12222; border-radius: 14px; background: #D32F2F; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; opacity: {{stopOpacity}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF"><rect x="5" y="5" width="14" height="14" rx="2.5"></rect></svg>
      หยุดทั้งหมด
    </button>
    <div style="flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 14px">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{statusDot}}"></span>{{statusText}}</span>
      <button disabled="{{sendDisabled}}" style="height: 56px; padding: 0 24px; border: none; border-bottom: 4px solid {{sendEdge}}; border-radius: 14px; background: {{sendBg}}; color: {{sendFg}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{sendFg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"></path></svg>
        {{sendLabel}}
      </button>
    </div>
  </footer>

  <!-- Drag layer -->
  <div style="position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 20">
    <sc-for list="{{dragPieces}}" as="p" hint-placeholder-count="0">
            <sc-if value="{{p.isPath}}" hint-placeholder-val="{{false}}"><svg width="{{p.sw0}}" height="{{p.sh0}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; overflow: visible; pointer-events: none; opacity: {{p.op}}"><path d="{{p.d}}" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="{{p.swid}}" onPointerDown="{{p.down}}" style="pointer-events: {{p.pe}}; cursor: {{p.cur}}; touch-action: none"></path></svg></sc-if>

      if (!this.measureRoot()) return;
      const r = e.currentTarget.getBoundingClientRect();
      this.setState({ dd: { nid, si, opts, x: (r.left - this._rr.left) / this._sc, y: (r.bottom - this._rr.top) / this._sc + 4 } });
    };
  }
  onField(nid, si, numeric) {
    return (e) => {
      const v = e.target.value;
      if (numeric && !/^-?\d*\.?\d*$/.test(v)) return;
      const m = this.clone(this.cur());
      if (!m.nodes[nid]) return;
      m.nodes[nid].f[si] = v;
      this.setState({ model: m });
    };
  }
  onFieldFocus() { return () => this.pushHist(this.cur()); }
  onMut(nid, dir) {
    return () => {
      const before = this.cur();
      const m = this.clone(before);
      const n = m.nodes[nid];
      if (!n) return;
      const br = n.br || { elif: 0, els: false };
      if (dir > 0) {
        this.pushHist(before);
        if (!br.els) { br.els = true; n.m.push([]); }
        else { br.elif += 1; n.m.splice(br.elif, 0, []); }
        n.br = br;
        this.setState({ model: m, toast: null });
        return;
      }
      let spill = [], rep = null;
      if (br.elif > 0) { spill = n.m.splice(br.elif, 1)[0] || []; rep = n.s[br.elif] || null; delete n.s[br.elif]; br.elif -= 1; }
      else if (br.els) { spill = n.m.pop() || []; br.els = false; }
      else return;
      this.pushHist(before);
      n.br = br;
      const p = (this._lastPos || {})[nid] || { x: 20, y: 20 };
      const w = this.blockSize(nid, m).w;
      if (spill.length) m.top.push({ x: p.x + w + 28, y: p.y, ids: spill });
      if (rep) m.top.push({ x: p.x + w + 28, y: p.y + (spill.length ? this.listH(spill, m) + 16 : 0), ids: [rep] });
      const moved = spill.length || rep;
      this.setState({ model: m, toast: moved ? { text: 'ย้ายบล็อกในทางที่ลบออกมาวางข้าง ๆ', kind: 'model' } : null });
    };
  }
  doUndo() {
    this._hist = this._hist || []; this._fut = this._fut || [];
    if (!this._hist.length) return;
    this._fut.push(JSON.stringify(this.cur()));
    this.setState({ model: JSON.parse(this._hist.pop()), toast: null, dd: null });
  }
  doRedo() {
    this._hist = this._hist || []; this._fut = this._fut || [];
    if (!this._fut.length) return;
    this._hist.push(JSON.stringify(this.cur()));
    this.setState({ model: JSON.parse(this._fut.pop()), toast: null, dd: null });
  }

  /* ---------- code ---------- */
  val(m, n, tk) {
    if (tk.t === 'd') return String(n.f[tk.i] ?? tk.d);
    const ch = n.s[tk.i];
    if (ch && m.nodes[ch]) return this.expr(m, ch);
    if (tk.e) return '___';
    const v = String(n.f[tk.i] ?? tk.d);
    if (tk.k === 'h') return v === 'เท็จ' ? 'False' : 'True';
    if (tk.n || v === 'item') return v === '' ? '0' : v;
    return JSON.stringify(v);
  }
  args(m, n, c) { return this.allToks(c, n).filter((t) => t.t !== 'x').map((t) => this.val(m, n, t)); }
  expr(m, id) {
    const n = m.nodes[id], c = this.K().byId[n.c], a = this.args(m, n, c);
    const OP = { '−': '-', '×': '*', '÷': '/' };
    switch (c.id) {
      case 'r26-0': return 'time.ticks_ms()';
      case 'r40-0': return '(' + a[0] + ' ' + (OP[a[1]] || a[1]) + ' ' + a[2] + ')';
      case 'r40-1': return '0';
      case 'r41-0': return '(' + a[0] + ' ' + a[1] + ' ' + a[2] + ')';
      case 'r42-0': return 'math.' + a[0] + '(' + a[1] + ')';
      case 'r44-0': return a[0] + (a[1] === '++' ? ' + 1' : ' - 1');
      case 'r50-0': return 'max(' + a[1] + ', min(' + a[2] + ', ' + a[0] + '))';
      case 'r53-0': return '(' + a[0] + (a[1] === 'และ' ? ' and ' : ' or ') + a[2] + ')';
      case 'r55-0': return 'not ' + a[0];
      case 'r56-0': return a[0] === 'จริง' ? 'True' : 'False';
      case 'r59-0': return '"hello"';
      case 'r60-0': return 'str(' + a[0] + ') + str(' + a[1] + ')';
      default: return 'blk_r' + c.row + '(' + a.join(', ') + ')';
    }
  }
  stmts(m, ids, ind, out) {
    const real = ids.filter((id) => m.nodes[id]);
    if (!real.length) { out.push(ind + 'pass'); return; }
    real.forEach((id) => {
      const n = m.nodes[id], c = this.K().byId[n.c];
      if (c.k === 'if') {
        const br = n.br || { elif: 0, els: false };
        for (let k = 0; k <= br.elif; k++) {
          const ch = n.s[k];
          out.push(ind + (k ? 'elif ' : 'if ') + (ch && m.nodes[ch] ? this.expr(m, ch) : '___') + ':');
          this.stmts(m, n.m[k] || [], ind + '    ', out);
        }
        if (br.els) { out.push(ind + 'else:'); this.stmts(m, n.m[br.elif + 1] || [], ind + '    ', out); }
        return;
      }
      const a = this.args(m, n, c);
      if (c.k === 'c') {
        const until = String(a[0] || '').indexOf('จนกว่า') === 0;
        if (c.id === 'r20-0') { out.push(ind + 'while ' + (until ? 'not ' : '') + a[1] + ':'); this.stmts(m, n.m[0], ind + '    ', out); return; }
        if (c.id === 'r19-0') { out.push(ind + 'while True:'); this.stmts(m, n.m[0], ind + '    ', out); out.push(ind + '    if ' + (until ? '' : 'not ') + a[1] + ': break'); return; }
        if (c.id === 'r24-0') { out.push(ind + 'for i in range(' + a[0] + ', ' + a[1] + ', ' + a[2] + '):'); this.stmts(m, n.m[0], ind + '    ', out); return; }
        out.push(ind + 'blk_r' + c.row + '(' + a.join(', ') + '):');
        this.stmts(m, n.m[0], ind + '    ', out);
        return;
      }
      let s;
      switch (c.id) {
        case 'r18-0': s = 'raise SystemExit'; break;
        case 'r21-0': s = (a[0] === 'ไมโครวินาที' ? 'time.sleep_us(' : 'time.sleep_ms(') + a[1] + ')'; break;
        case 'r43-0': s = a[0] + ' ' + a[1] + ' ' + a[2]; break;
        case 'r85-0': s = 'print(' + a[0] + ')'; break;
        default: s = 'blk_r' + c.row + '(' + a.join(', ') + ')';
      }
      out.push(ind + s);
    });
  }
  gen(m) {
    const out = ['import time', 'import math', ''];
    const tops = m.top.filter((e) => m.nodes[e.ids[0]] && this.K().byId[m.nodes[e.ids[0]].c].hat);
    const starts = tops.filter((e) => m.nodes[e.ids[0]].c === 'start');
    const loops = tops.filter((e) => m.nodes[e.ids[0]].c === 'r189-0');
    if (!tops.length) out.push('# ยังไม่มีบล็อกเริ่มต้น หรือ โปรแกรมหลัก');
    starts.forEach((e) => {
      out.push('# เริ่มต้น');
      const l = m.nodes[e.ids[0]].m[0] || [];
      if (l.length) this.stmts(m, l, '', out);
      out.push('');
    });
    loops.forEach((e) => {
      out.push('while True:  # โปรแกรมหลัก วนทำซ้ำ');
      this.stmts(m, m.nodes[e.ids[0]].m[0] || [], '    ', out);
      out.push('');
    });
    return out.map((t) => (t.indexOf('blk_') >= 0 || t.indexOf('___') >= 0 ? t + '  # ❓' : t));
  }

  /* ---------- render ---------- */
  renderVals() {
    const K = this.K(), R = this.R3();
    const S = this.state || {}, P = this.props || {};
    const model = this.cur();
    const drag = S.drag || null;
    const menu = S.menu ?? (P.menu ?? 'Control');
    const codeOpen = S.codeOpen ?? (P.codeOpen ?? false);
    const robot = P.robotState ?? 'connected';
    const favs = S.favs ?? ['r22-0', 'r21-0', 'r209-0', 'r223-0'];

    // workspace
    const base = this.layoutWS(model, null);
    this._lastPos = base.pos;
    let cand = null;
    if (drag && !drag.over) cand = this.findCand(model, drag, base);
    this._cand = cand;
    let view = base;
    if (cand && cand.t !== 'slot') {
      const pm = this.clone(model);
      this.applyCand(pm, drag.ids, cand);
      view = this.layoutWS(pm, this.descendants(pm, drag.ids, {}));
    }
    let wsPieces = view.pieces;
    if (cand && cand.t === 'slot') {
      const d = cand.k === 'h' ? this.hexD(cand.w + 6, 32) : this.pillD(cand.w + 6, 32);
      wsPieces = wsPieces.concat([this.P({ isPath: true, x: cand.x - 3, y: cand.y - 16, sw0: cand.w + 6, sh0: 32, d, fill: 'rgba(255,255,255,0.35)', stroke: '#FFFFFF', swid: 3 })]);
    }

    // drag layer
    let dragPieces = [];
    if (drag) {
      const dctx = { st: model, pieces: [], live: false, down: null };
      const ox = drag.px - drag.offX, oy = drag.py - drag.offY;
      const c0 = K.byId[model.nodes[drag.ids[0]].c];
      if (this.isRep(c0)) this.placeRep(drag.ids[0], ox, oy, dctx);
      else this.placeList(drag.ids, null, ox, oy, dctx);
      dragPieces = dctx.pieces.map((p) => Object.assign(p, { op: 0.92 }));
    }

    // palette
    const items = menu === 'fav' ? favs.filter((id) => K.byId[id]) : K.LIST.filter((c) => c.m === menu).map((c) => c.id);
    const pctx = { st: { nodes: {} }, pieces: [], live: false };
    let py = 12, pw = 380;
    items.forEach((cid, idx) => {
      const tmp = { nodes: {} };
      const tid = this.newNode(tmp, cid);
      pctx.st = tmp;
      const c = K.byId[cid];
      const bx = 56, by = py;
      pctx.down = () => (e) => this.onDown(e, { src: 'pal', cat: cid, ox: bx, oy: by });
      pctx.dis = false;
      let z;
      if (this.isRep(c)) z = this.placeRep(tid, bx, by, pctx);
      else z = this.placeBlock(tid, bx, by, pctx);
      const fav = favs.includes(cid);
      pctx.pieces.push(this.P({ isStar: true, x: 6, y: by + Math.min(z.h, 44) / 2 - 22, w: 44, h: 44, fill: fav ? '#FFB020' : 'none', stroke: fav ? '#C27A00' : '#8A94A6', aria: fav ? 'เอาออกจากของโปรด' : 'เพิ่มในของโปรด', click: () => {
        const next = fav ? favs.filter((x) => x !== cid) : favs.concat([cid]);
        this.setState({ favs: next, toast: { text: fav ? 'เอาออกจากของโปรดแล้ว' : 'เพิ่มในของโปรดแล้ว', kind: 'fav', prev: favs } });
      } }));
      if (P.showSource) pctx.pieces.push(this.P({ isText: true, x: bx, y: by + z.h + 6, h: 16, t: 'แถว ' + c.row + (c.note ? ' · ' + c.note : ''), color: '#5A6377' }));
      py += z.h + (P.showSource ? 30 : 18) + K.ND;
      pw = Math.max(pw, bx + z.w + 24);
    });

    // menus
    const menuRow = (id, name, color, edge, count, divider) => ({
      name, color, edge, count, divider, selected: id === menu,
      bg: id === menu ? '#EAF2FD' : 'transparent', border: id === menu ? '#1866C9' : 'transparent', weight: id === menu ? 700 : 600,
      pick: () => this.setState({ menu: id })
    });
    const menus = [menuRow('fav', 'ของโปรด', '#FFB020', '#C27A00', String(favs.length), true)]
      .concat(K.MENUS.map((mn) => menuRow(mn, mn, K.COL[mn][0], K.COL[mn][1], String(K.LIST.filter((c) => c.m === mn).length), false)));
    const counts = {};
    items.forEach((cid) => { const k = K.byId[cid].k === 'if' ? 'c' : K.byId[cid].k; counts[k] = (counts[k] || 0) + 1; });
    const SH = { cmd: 'คำสั่ง', c: 'บล็อกครอบ', round: 'มน', hex: 'หกเหลี่ยม' };
    const sub = ['cmd', 'c', 'round', 'hex'].filter((k) => counts[k]).map((k) => SH[k] + ' ' + counts[k]).join(' · ');

    const RS = {
      connected: { name: 'หุ่นกลุ่ม 3', sub: 'เชื่อมต่อแล้ว', dot: '#2E7D32', chipBg: '#FFFFFF', status: 'มีการแก้ไขที่ยังไม่ได้ส่งลงหุ่น', statusDot: '#FFB020', send: 'ส่งลงหุ่นและเริ่มทำงาน', ok: true, connect: false },
      notConnected: { name: 'ยังไม่ได้เชื่อมต่อหุ่น', sub: 'เสียบสาย USB แล้วกดเชื่อมต่อ', dot: '#8A94A6', chipBg: '#F7F9FC', status: 'เชื่อมต่อหุ่นก่อน จึงจะส่งโปรแกรมได้', statusDot: '#8A94A6', send: 'ส่งลงหุ่นและเริ่มทำงาน', ok: false, connect: true },
      running: { name: 'หุ่นกลุ่ม 3', sub: 'โปรแกรมกำลังทำงาน', dot: '#2E7D32', chipBg: '#FFFFFF', status: 'ตรงกับหุ่นแล้ว · โปรแกรมทำงานบนหุ่นกลุ่ม 3', statusDot: '#2E7D32', send: 'ส่งลงหุ่นอีกครั้ง', ok: true, connect: false }
    }[robot] || {};

    const code = codeOpen ? this.gen(model).map((t, i) => ({
      n: i + 1, text: t,
      color: t.indexOf('❓') >= 0 ? '#8A5A00' : (t.trim().indexOf('#') === 0 ? '#5A6377' : '#14243D'),
      bg: t.indexOf('❓') >= 0 ? '#FFF4DC' : 'transparent'
    })) : [];

    const toast = S.toast || null;
    const dd = S.dd || null;
    const hist = this._hist || [], fut = this._fut || [];
    const over = drag ? drag.over : null;

    return {
      rootRef: R.root, wsRef: R.ws, palRef: R.pal, palInRef: R.palIn, trashRef: R.trash,
      onMove: (e) => this.onMoveEv(e), onUp: (e) => this.onUpEv(e),
      onRootDown: () => { if (this.state && this.state.dd) this.setState({ dd: null }); },
      stopEv: (e) => e.stopPropagation(),
      wsPieces, palPieces: pctx.pieces, dragPieces, palW: pw, palH: py + 24,
      overPal: over === 'pal',
      trashBg: over === 'trash' ? '#D32F2F' : '#FFFFFF', trashBorder: over === 'trash' ? '#A12222' : '#DCE3EC', trashIcon: over === 'trash' ? '#FFFFFF' : '#5A6377',
      hasDD: !!dd, ddX: dd ? dd.x : 0, ddY: dd ? dd.y : 0,
      ddOpts: dd ? dd.opts.map((o) => {
        const curV = String(((this.cur().nodes[dd.nid] || {}).f || {})[dd.si] ?? '');
        return { label: o, bg: o === curV ? '#EAF2FD' : 'transparent', weight: o === curV ? 700 : 500, pick: () => {
          const before = this.cur(); const m = this.clone(before);
          if (m.nodes[dd.nid]) { this.pushHist(before); m.nodes[dd.nid].f[dd.si] = o; }
          this.setState({ model: m, dd: null });
        } };
      }) : [],
      robotName: RS.name, robotSub: RS.sub, robotDot: RS.dot, robotChipBg: RS.chipBg, showConnect: RS.connect,
      statusText: RS.status, statusDot: RS.statusDot, sendLabel: RS.send, sendDisabled: !RS.ok,
      sendBg: RS.ok ? '#FFB020' : '#EEF1F5', sendEdge: RS.ok ? '#C27A00' : '#DCE3EC', sendFg: RS.ok ? '#14243D' : '#8A94A6',
      stopDisabled: !RS.ok, stopOpacity: RS.ok ? 1 : 0.45,
      undo: () => this.doUndo(), redo: () => this.doRedo(),
      noUndo: !hist.length, noRedo: !fut.length, undoOp: hist.length ? 1 : 0.45, redoOp: fut.length ? 1 : 0.45,
      menus,
      paletteTitle: menu === 'fav' ? 'ของโปรดของฉัน' : menu,
      paletteSub: menu === 'fav' ? 'บล็อกที่ใช้บ่อย หยิบได้ทันที' : (items.length + ' บล็อก · ' + sub),
      showFavEmpty: menu === 'fav' && favs.length === 0,
      codeOpen, codeBtnLabel: codeOpen ? 'ซ่อนโค้ด' : 'ดูโค้ด', toggleCode: () => this.setState({ codeOpen: !codeOpen }), codeLines: code,
      hasToast: !!toast, toastText: toast ? toast.text : '',
      undoToast: () => {
        if (toast && toast.kind === 'fav') this.setState({ favs: toast.prev, toast: null });
        else this.doUndo();
      }
    };
  }
}
</script>
