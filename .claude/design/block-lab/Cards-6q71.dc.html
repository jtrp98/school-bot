<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>การ์ดสถานะส่งลงบอร์ด</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #B85E00;outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sp{animation:bl-spin .8s linear infinite}
@keyframes bl-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
</style>
</helmet>
<!-- SCR-19 · การ์ดสถานะ (เปิดขึ้นด้านบนของแถบล่าง ไม่บังปุ่มหยุด) / dialog เตือนต่อสายจริง -->
<div style="{{rootStyle}}" role="{{role}}" aria-label="{{title}}">

  <div style="display:flex;gap:14px;align-items:flex-start">
    <sc-if value="{{hasMascot}}" hint-placeholder-val="{{true}}">
      <dc-import name="Mascot" pose="{{pose}}" h="96" alt="{{mascotAlt}}" hint-size="64px,96px"></dc-import>
    </sc-if>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:8px;font-size:{{titleSize}}px;font-weight:700;line-height:1.5">
        <sc-if value="{{spin}}" hint-placeholder-val="{{false}}"><svg class="i sp" viewBox="0 0 24 24" style="width:24px;height:24px;color:#1866C9" aria-hidden="true"><path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"></path></svg></sc-if>
        <sc-if value="{{hasTitleIcon}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px;color:#2E7D32" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></sc-if>
        <span>{{title}}</span>
      </div>
      <sc-for list="{{body}}" as="t" hint-placeholder-count="1">
        <div style="font-size:16px;line-height:1.6;margin-top:4px">{{t.v}}</div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{hasList}}" hint-placeholder-val="{{false}}">
    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{list}}" as="it" hint-placeholder-count="2">
        <div style="display:flex;align-items:flex-start;gap:10px;font-size:16px;line-height:1.6">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#EAF2FD;border:2px solid #C6D6EA;font-size:16px;font-weight:700;flex-shrink:0;box-sizing:border-box">{{it.n}}</span>
          <span style="padding-top:1px">{{it.v}}</span>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{hasProgress}}" hint-placeholder-val="{{false}}">
    <div>
      <div style="height:14px;border-radius:7px;background:#EAF2FD;border:2px solid #C6D6EA;overflow:hidden;box-sizing:border-box" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" aria-label="ความคืบหน้า"><div style="{{barStyle}}"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:16px;line-height:1.6;color:#5A6377"><span>{{stepText}}</span><span>{{pct}}%</span></div>
    </div>
  </sc-if>

  <sc-if value="{{hasNote}}" hint-placeholder-val="{{false}}">
    <div style="{{noteStyle}}" role="note"><svg class="i" viewBox="0 0 24 24" style="margin-top:3px" aria-hidden="true"><path d="{{noteIcon}}"></path></svg><span>{{noteText}}</span></div>
  </sc-if>

  <sc-if value="{{hasCheck}}" hint-placeholder-val="{{false}}">
    <label style="display:flex;align-items:center;gap:12px;min-height:44px;font-size:16px;font-weight:600;line-height:1.6"><input type="checkbox" style="width:24px;height:24px;accent-color:#1866C9;margin:0">ไม่ต้องเตือนอีกในงานนี้<span style="font-size:14px;font-weight:500;color:#5A6377">(ถ้าวงจรเปลี่ยน จะเตือนใหม่)</span></label>
  </sc-if>

  <sc-if value="{{hasCode}}" hint-placeholder-val="{{false}}">
    <div style="font-size:14px;line-height:1.6;color:#5A6377">รหัสข้อผิดพลาด: {{code}}</div>
  </sc-if>

  <sc-if value="{{hasButtons}}" hint-placeholder-val="{{true}}">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <sc-for list="{{buttons}}" as="b" hint-placeholder-count="2">
        <button style="{{b.style}}">{{b.label}}</button>
        <sc-if value="{{b.spacer}}" hint-placeholder-val="{{false}}"><span style="flex:1"></span></sc-if>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"success","options":["warn","nodevice","compile","send","success","fail","stop0","stopA","stopB","guardRun","guardSend"]},"stage":{"editor":"enum","default":"no","options":["no","yes"]},"why":{"editor":"enum","default":"usb","options":["usb","compile"]},"$preview":{"width":420,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind || 'success';
    const stage = this.props.stage === 'yes';
    const why = this.props.why || 'usb';
    const BTN = 'display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font-size:16px;font-weight:700;line-height:1.5;';
    const B = {
      blue: BTN + 'background:#1866C9;color:#fff;border:2px solid #1866C9;border-bottom:4px solid #0F4C99',
      orange: BTN + 'background:#FF8A00;color:#14243D;border:2px solid #FF8A00;border-bottom:4px solid #B85E00',
      plain: BTN + 'background:#fff;color:#14243D;border:2px solid #C6D6EA;border-bottom:4px solid #C6D6EA'
    };
    const ALERT = 'M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01';
    const MON = 'M3 4h18v12H3zM8 21h8M12 16v5';
    const INFO = 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 16v-4M12 8h.01';
    const NOTE_INFO = 'display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#EAF2FD;border:2px solid #C6D6EA;font-size:16px;font-weight:600;line-height:1.6';
    const NOTE_WARN = 'display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#FFF4CC;border:2px solid #B07F00;font-size:16px;font-weight:600;line-height:1.6';
    const d = { w: 420, role: 'dialog', pose: 0, title: '', titleSize: 20, spin: false, tick: false, body: [], list: [], pct: -1, step: '', note: null, check: false, code: '', buttons: [], shadow: '0 8px 20px rgba(20,36,61,.2)', mAlt: '' };

    if (kind === 'warn') {
      d.w = 520; d.title = 'ต่อสายจริงให้ตรงกับวงจรในจอ'; d.titleSize = 24; d.shadow = '0 16px 40px rgba(20,36,61,.3)';
      d.body = ['แอปตรวจสายจริงไม่ได้ ถ้าสายไม่ตรง บอร์ดอาจไม่ทำงานตามที่เห็นในจอ'];
      d.list = ['LED ขา 9 ผ่านตัวต้านทาน 220 Ω แล้วไปที่ GND', 'ปุ่มกด ขา 2 แล้วไปที่ GND', 'ลูกบิด ขา A0 ต่อ 5V และ GND'];
      d.note = [NOTE_WARN, ALERT, 'จำลองผ่านในจอ ไม่ได้แปลว่าปลอดภัยกับบอร์ดจริง ตรวจตัวต้านทานและขาที่ต่อก่อนเสมอ'];
      d.check = true;
      d.buttons = [{ label: 'ดูวงจร', style: B.plain, spacer: true }, { label: 'ยกเลิก', style: B.plain }, { label: 'ส่งต่อ', style: B.orange }];
    } else if (kind === 'nodevice') {
      d.role = 'status'; d.pose = 4; d.mAlt = 'มาสคอต School Bot ท่าแว่นขยาย ค้นหาบอร์ด'; d.title = 'ไม่พบบอร์ด Uno';
      d.body = ['ลองทำทีละข้อนะ']; d.list = ['เสียบสาย USB เข้าบอร์ดและเข้าคอมพิวเตอร์', 'รอสักครู่ แล้วกด "ลองอีกครั้ง"']; d.code = 'E-USB';
      d.buttons = [{ label: 'ลองอีกครั้ง', style: B.blue }, { label: 'ปิด', style: B.plain }];
    } else if (kind === 'compile') {
      d.role = 'status'; d.pose = 7; d.mAlt = 'มาสคอต School Bot ท่าวิ่ง กำลังทำงาน'; d.title = 'กำลังแปลงโค้ด…'; d.spin = true;
      d.body = ['รอสักครู่ ยังไม่ได้ส่งลงบอร์ด']; d.pct = 35; d.step = 'ขั้นที่ 1 จาก 2 · แปลงโค้ด';
    } else if (kind === 'send') {
      d.role = 'status'; d.pose = 7; d.mAlt = 'มาสคอต School Bot ท่าวิ่ง กำลังทำงาน'; d.title = 'กำลังส่งลงบอร์ด…'; d.spin = true;
      d.body = ['อย่าถอดสาย USB ระหว่างส่ง']; d.pct = 70; d.step = 'ขั้นที่ 2 จาก 2 · ส่งลงบอร์ด';
    } else if (kind === 'success') {
      d.role = 'status'; d.pose = 10; d.mAlt = 'มาสคอต School Bot ท่ายกนิ้วโป้ง สำเร็จ'; d.title = 'ส่งลงบอร์ดสำเร็จ'; d.tick = true;
      d.body = ['ส่งโปรแกรมเข้าบอร์ด Uno แล้ว'];
      if (stage) d.note = [NOTE_INFO, MON, 'บล็อกตัวละครทำงานเฉพาะในจอ'];
      d.buttons = [{ label: 'เรียบร้อย', style: B.blue }];
    } else if (kind === 'fail') {
      d.role = 'alert'; d.pose = 3; d.mAlt = 'มาสคอต School Bot ท่าคิด ลองใหม่นะ';
      if (why === 'compile') {
        d.title = 'แปลงโค้ดไม่ผ่าน'; d.body = ['ช่อง "ถ้า" ยังว่าง บอร์ดจึงยังไม่ได้รับโปรแกรม'];
        d.list = ['ไปที่บล็อกที่มีป้ายเตือน', 'ใส่บล็อกในช่องว่าง แล้วส่งใหม่']; d.code = 'E-BUILD';
        d.buttons = [{ label: 'ไปที่บล็อก', style: B.blue }, { label: 'ปิด', style: B.plain }];
      } else {
        d.title = 'ส่งลงบอร์ดไม่สำเร็จ'; d.body = ['สาย USB หลุดระหว่างส่ง ไม่เป็นไร ลองใหม่ได้'];
        d.list = ['เช็กว่าสาย USB เสียบแน่นทั้งสองด้าน', 'กด "ส่งลงบอร์ด" อีกครั้ง']; d.code = 'E-USB';
        d.buttons = [{ label: 'ลองอีกครั้ง', style: B.blue }, { label: 'ปิด', style: B.plain }];
      }
    } else if (kind === 'stop0') {
      d.role = 'status'; d.title = 'หยุดตัวจำลองและตัวละครแล้ว'; d.tick = true;
      d.body = ['โปรแกรมที่อยู่บนบอร์ด Uno อาจยังทำงานอยู่ ถ้าต้องการให้หยุด ให้ถอดสาย USB ออก'];
      d.buttons = [{ label: 'ตกลง', style: B.plain }];
    } else if (kind === 'stopA') {
      d.role = 'status'; d.title = 'หยุดทั้งหมดแล้ว'; d.tick = true;
      d.body = ['ตัวจำลอง ตัวละคร และบอร์ด Uno หยุดแล้ว'];
      d.buttons = [{ label: 'ตกลง', style: B.plain }];
    } else if (kind === 'stopB') {
      d.role = 'status'; d.title = 'กำลังหยุดบอร์ด…'; d.spin = true;
      d.body = ['ตัวจำลองและตัวละครหยุดแล้ว · กำลังส่งโปรแกรมว่างให้บอร์ด Uno']; d.pct = 60; d.step = 'รอสักครู่';
      d.note = [NOTE_WARN, ALERT, 'โปรแกรมเดิมบนบอร์ดจะหาย จนกว่าจะส่งโปรแกรมใหม่'];
    } else if (kind === 'guardRun') {
      d.w = 480; d.title = 'กำลังจำลองอยู่'; d.titleSize = 24; d.shadow = '0 16px 40px rgba(20,36,61,.3)';
      d.body = ['ถ้าเปิดงานใหม่ จะหยุดจำลองก่อน และเก็บงานนี้ไว้ให้'];
      d.buttons = [{ label: 'กลับไปทำต่อ', style: B.plain, spacer: true }, { label: 'หยุดและเปิดงานใหม่', style: B.blue }];
    } else if (kind === 'guardSend') {
      d.w = 480; d.title = 'กำลังส่งลงบอร์ดอยู่'; d.titleSize = 24; d.shadow = '0 16px 40px rgba(20,36,61,.3)';
      d.body = ['รอให้ส่งเสร็จก่อน แล้วค่อยเปิดงานใหม่ · อย่าถอดสาย USB'];
      d.buttons = [{ label: 'ตกลง', style: B.blue }];
    }

    const ntxt = d.note ? d.note : ['', '', ''];
    return {
      rootStyle: 'width:' + d.w + 'px;box-sizing:border-box;background:#fff;border:2px solid #DCE3EC;border-radius:16px;padding:16px;color:#14243D;display:flex;flex-direction:column;gap:12px;box-shadow:' + d.shadow,
      role: d.role, title: d.title, titleSize: d.titleSize,
      hasMascot: d.pose > 0, pose: String(d.pose || 1), mascotAlt: d.mAlt,
      spin: d.spin, hasTitleIcon: d.tick,
      body: d.body.map((v) => ({ v })),
      hasList: d.list.length > 0, list: d.list.map((v, k) => ({ n: String(k + 1), v })),
      hasProgress: d.pct >= 0, pct: String(Math.max(0, d.pct)), stepText: d.step,
      barStyle: 'height:100%;width:' + Math.max(0, d.pct) + '%;background:#1866C9',
      hasNote: !!d.note, noteStyle: ntxt[0], noteIcon: ntxt[1], noteText: ntxt[2],
      hasCheck: d.check, hasCode: !!d.code, code: d.code,
      hasButtons: d.buttons.length > 0, buttons: d.buttons.map((b) => ({ label: b.label, style: b.style, spacer: !!b.spacer }))
    };
  }
}
</script>
</body>
</html>
