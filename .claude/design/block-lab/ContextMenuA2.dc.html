<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เมนูคลิกขวา บล็อก A2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
.cm-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.cm-it{box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;margin:0;padding:8px 12px;border:0;border-radius:12px;background:transparent;color:#14243D;font-family:inherit;font-size:16px;font-weight:600;line-height:1.4;text-align:left;cursor:pointer}
.cm-it:hover{background:#EAF2FD}
.cm-it:focus-visible{outline:3px solid #1866C9;outline-offset:-3px;background:#EAF2FD}
.cm-it[aria-disabled="true"]{color:#5A6377;cursor:default}
.cm-it[aria-disabled="true"]:hover{background:#F4F6F8}
.cm-it.cm-danger{color:#D32F2F}
.cm-sub{display:block;font-size:14px;font-weight:500;color:#5A6377;line-height:1.4}
.cm-kbd{margin-left:auto;padding-left:8px;font-size:12px;font-weight:700;color:#5A6377;white-space:nowrap}
.cm-btn{position:relative;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:12px;background:transparent;color:#14243D;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.cm-btn:hover{background:#EAF2FD}
.cm-btn:focus-visible,.cm-tb:focus-visible,.cm-pk:focus-visible,.cm-tx:focus-visible{outline:3px solid #1866C9;outline-offset:2px}
.cm-btn[aria-disabled="true"]{color:#5A6377;cursor:default}
.cm-gf:focus{outline:none}
.cm-gf:focus-visible{outline:3px solid #1866C9;outline-offset:2px;box-shadow:0 0 0 2px #FFFFFF}
.cm-sb:focus-within{border-color:#1866C9!important}
.cm-ta:focus-visible{outline:none;border-color:#1866C9!important}
.cm-chev{position:relative;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0;width:44px;height:44px;margin:0 0 0 -6px;padding:0;border:0;border-radius:12px;background:transparent;color:#14243D;cursor:pointer}
.cm-chev:focus-visible{outline:none}
.cm-chev:focus-visible>span{box-shadow:0 0 0 2px #FFFFFF,0 0 0 5px #1866C9}
.cm-tip::after{content:attr(data-tip);display:none;position:absolute;left:12px;top:calc(100% + 6px);z-index:42;padding:4px 12px;border-radius:8px;background:#14243D;color:#FFFFFF;font-size:14px;font-weight:500;line-height:1.6;white-space:nowrap;pointer-events:none}
.cm-tip:hover::after{display:block}
.cm-ring-p{stroke-dasharray:201.06;stroke-dashoffset:201.06;animation:cmring 0.38s linear forwards}
@keyframes cmring{to{stroke-dashoffset:0}}
.cm-rm .cm-ring-p{animation:none;stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){.cm-ring-p{animation:none;stroke-dashoffset:0}}
.cm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<!-- ContextMenuA2 · R21 (2026-10-30 · OQ210–OQ216) · ต้นแบบใช้งานได้ ของเมนูคลิกขวา/กดค้าง 3 แบบ + ไอคอนเฟือง ? ทึบ + สถานะบล็อกใหม่ (ย่อ · ปิดใช้ · คอมเมนต์) + แถบค้นหา + กระเป๋า + กล่องยืนยัน
     ข้อจำกัดตรงไปตรงมา: ไฟล์นี้เป็นต้นแบบแยก (โมเดลบล็อกจำลอง 12 บล็อก · วาดด้วย BlockA2) ยังไม่ได้เดินสายเข้า BlocksPaneA2 (โมเดลจริง 3,700 บรรทัด) · dev ใช้ D1 §R21 เป็นสัญญา · ยังไม่ได้ render ตรวจ · ตรวจไวยากรณ์ด้วยตาอย่างเดียว -->
<div id="cm-root" class="{{rootCls}}" onKeyDown="{{rootKey}}" onPointerDownCapture="{{rootDownCap}}" style="position:relative;width:1280px;height:800px;overflow:hidden;background:#F4F7FB;color:#14243D;font-family:'IBM Plex Sans Thai',system-ui,sans-serif">
  <div style="position:absolute;left:24px;top:8px;right:24px;height:48px;display:flex;align-items:center;gap:16px">
    <div style="font-size:20px;font-weight:700;line-height:1.3;white-space:nowrap">R21 · เมนูคลิกขวา / กดค้าง</div>
    <div style="flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.4;color:#5A6377">{{hint}}</div>
  </div>
  <div id="cm-ws" tabindex="0" role="group" aria-label="{{wsAria}}" data-bg="1" onContextMenu="{{wsCtx}}" onPointerDown="{{wsDown}}" onPointerMove="{{wsMove}}" onPointerUp="{{wsUp}}" onPointerCancel="{{wsUp}}" style="position:absolute;left:0;top:60px;width:1280px;height:740px;overflow:hidden;background-color:#FFFFFF;background-image:radial-gradient(#DCE3EC 1.3px,transparent 1.3px);background-size:24px 24px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-top:1px solid #DCE3EC;box-sizing:border-box">
    <div aria-hidden="true" style="position:absolute;right:16px;bottom:16px;width:60px;height:314px;box-sizing:border-box;border:2px dashed #C6D6EA;border-radius:16px;display:flex;align-items:center;justify-content:center;pointer-events:none"><span style="writing-mode:vertical-rl;font-size:14px;font-weight:600;color:#5A6377;white-space:nowrap">ชุดปุ่มซูม (ตำแหน่งจริง D1 §1.6)</span></div>

    <sc-for list="{{notes}}" as="nt" hint-placeholder-count="0">
      <div style="{{nt.st}}">
        <div style="display:flex;align-items:center;gap:4px;padding:0 0 0 12px;min-height:44px"><span style="flex:1;font-size:14px;font-weight:700;color:#5A6377">{{nt.title}}</span><button type="button" class="cm-btn" aria-label="{{nt.delAria}}" onClick="{{nt.del}}"><svg class="cm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div>
        <textarea class="cm-ta" maxlength="200" aria-label="{{nt.title}}" placeholder="{{nt.ph}}" onInput="{{nt.input}}" style="display:block;box-sizing:border-box;width:100%;height:96px;margin:0;padding:8px 12px;border:2px solid #DCE3EC;border-radius:0 0 12px 12px;border-top:1px solid #DCE3EC;resize:none;font:500 16px/1.5 'IBM Plex Sans Thai',system-ui,sans-serif;color:#14243D;user-select:text;-webkit-user-select:text">{{nt.t}}</textarea>
      </div>
    </sc-for>

    <sc-for list="{{draws}}" as="d" hint-placeholder-count="0">
      <div data-bid="{{d.id}}" class="{{d.cls}}" data-tip="{{d.tip}}" onPointerDown="{{d.down}}" onContextMenu="{{d.ctx}}" style="{{d.wst}}">
        <sc-if value="{{d.isBlock}}" hint-placeholder-val="{{true}}">
          <dc-import name="BlockA2" kind="{{d.kind}}" cat="{{d.cat}}" state="{{d.state}}" w="{{d.w}}" h="{{d.h}}" bars="{{d.bars}}" mouths="{{d.mouths}}" tab="{{d.tab}}" hd="{{d.hd}}" items="{{d.items}}" down="{{noop}}" decor="no" hint-size="150px,44px"></dc-import>
        </sc-if>
        <sc-if value="{{d.isBar}}" hint-placeholder-val="{{false}}">
          <div role="group" aria-label="{{d.barAria}}" style="{{d.barSt}}">
            <button type="button" class="cm-chev" aria-expanded="false" aria-label="{{d.expAria}}" onClick="{{d.expand}}" onPointerDown="{{noop}}"><span style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%"><svg class="cm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></button>
            <span style="flex:1;min-width:0;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;font-weight:700;line-height:20px"><sc-for list="{{d.parts}}" as="p" hint-placeholder-count="0"><sc-if value="{{p.isBlank}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display:inline-block;vertical-align:middle;width:22px;height:14px;box-sizing:border-box;border:2px dashed #14243D;border-radius:999px;background:rgba(255,255,255,0.6);margin:0 6px 0 0"></span></sc-if><sc-if value="{{p.isTxt}}" hint-placeholder-val="{{true}}"><span>{{p.t}}</span></sc-if></sc-for></span>
            <sc-if value="{{d.hasKids}}" hint-placeholder-val="{{false}}"><span style="flex-shrink:0;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,0.7);border:2px solid #14243D;font-size:14px;font-weight:700;line-height:18px">{{d.kidsT}}</span></sc-if>
            <sc-if value="{{d.hasWarn}}" hint-placeholder-val="{{false}}"><span style="flex-shrink:0;display:flex;align-items:center;gap:4px;padding:2px 10px 2px 6px;border-radius:999px;background:#FFF4CC;border:2px dashed #B07F00;font-size:14px;font-weight:700;line-height:18px"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;fill:none;stroke:#B07F00;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"></path></svg>{{d.warnT}}</span></sc-if>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="0">
      <div id="{{g.eid}}" class="cm-gf" tabindex="0" role="group" aria-label="{{g.aria}}" data-gid="{{g.id}}" style="{{g.st}}"></div>
    </sc-for>
    <sc-for list="{{hls}}" as="h" hint-placeholder-count="0">
      <div aria-hidden="true" style="{{h.st}}"></div>
    </sc-for>

    <sc-if value="{{hasBubble}}" hint-placeholder-val="{{false}}">
      <div role="dialog" aria-label="{{bub.title}}" style="{{bub.st}}">
        <div aria-hidden="true" style="position:absolute;left:14px;top:-8px;width:14px;height:14px;background:#FFFFFF;border-left:2px solid #C6D6EA;border-top:2px solid #C6D6EA;transform:rotate(45deg)"></div>
        <textarea id="cm-cmt" class="cm-ta" maxlength="200" aria-label="{{bub.title}}" placeholder="{{bub.ph}}" onInput="{{bub.input}}" style="display:block;box-sizing:border-box;width:100%;height:96px;margin:0;padding:8px 12px;border:2px solid #DCE3EC;border-radius:12px;resize:none;font:500 16px/1.5 'IBM Plex Sans Thai',system-ui,sans-serif;color:#14243D;user-select:text;-webkit-user-select:text">{{bub.t}}</textarea>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px"><span style="flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.4;color:#5A6377">{{bub.foot}} · 200</span><button type="button" class="cm-tx cm-btn" style="width:auto;padding:0 12px" onClick="{{bub.close}}">{{bub.closeT}}</button></div>
      </div>
    </sc-if>

    <div style="position:absolute;left:24px;right:16px;top:12px;display:flex;justify-content:flex-end;align-items:center;gap:8px;pointer-events:none;z-index:25">
      <sc-if value="{{sOpen}}" hint-placeholder-val="{{false}}">
        <div role="search" class="cm-sb" style="pointer-events:auto;box-sizing:border-box;flex:0 1 400px;min-width:0;display:flex;align-items:center;gap:2px;padding:4px 4px 4px 12px;background:#FFFFFF;border:2px solid #DCE3EC;border-radius:16px;box-shadow:0 8px 20px rgba(20,36,61,0.2)">
          <svg class="cm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
          <input id="cm-q" type="text" value="{{q}}" onInput="{{qIn}}" onKeyDown="{{qKey}}" placeholder="{{qPh}}" aria-label="{{qPh}}" style="flex:1;min-width:0;height:44px;margin:0 0 0 8px;padding:0;border:0;outline:none;background:transparent;color:#14243D;font:600 16px 'IBM Plex Sans Thai',system-ui,sans-serif;user-select:text;-webkit-user-select:text">
          <span role="status" aria-live="polite" style="flex-shrink:0;padding:0 6px;font-size:14px;font-weight:600;color:#5A6377;white-space:nowrap">{{qCount}}</span>
          <button type="button" class="cm-btn" aria-label="{{qPrevT}}" onClick="{{qPrev}}"><svg class="cm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
          <button type="button" class="cm-btn" aria-label="{{qNextT}}" onClick="{{qNext}}"><svg class="cm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" class="cm-btn" aria-label="{{closeT}}" onClick="{{qClose}}"><svg class="cm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
        </div>
      </sc-if>
      <sc-if value="{{badge}}" hint-placeholder-val="{{false}}">
        <div style="pointer-events:auto;flex-shrink:0;box-sizing:border-box;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:999px;background:#EAF2FD;border:2px solid #1866C9;color:#0F4C99;font-size:16px;font-weight:700;white-space:nowrap">กำลังจำลอง (ตัวบอก R10 ตัวอย่าง)</div>
      </sc-if>
      <div style="pointer-events:auto;flex-shrink:0;box-sizing:border-box;padding:4px;background:#FFFFFF;border:2px solid #DCE3EC;border-radius:16px;box-shadow:0 8px 20px rgba(20,36,61,0.2);display:flex">
        <button type="button" class="cm-btn cm-tb" aria-pressed="{{packOpen}}" aria-label="{{packBtnAria}}" onClick="{{togglePack}}" style="width:auto;min-width:44px;gap:4px;padding:0 10px"><svg class="cm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M8 21v-5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v5M8 10h8"></path></svg><span style="font-size:16px;font-weight:700">{{packCount}}</span></button>
      </div>
    </div>

    <sc-if value="{{packOpen}}" hint-placeholder-val="{{false}}">
      <div id="cm-pack" role="region" aria-label="{{packTitle}}" style="position:absolute;right:16px;top:72px;width:280px;max-height:338px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #DCE3EC;border-radius:16px;box-shadow:0 8px 20px rgba(20,36,61,0.2);z-index:28">
        <div style="display:flex;align-items:center;gap:8px;padding:8px 8px 4px 16px"><span style="flex:1;font-size:18px;font-weight:700">{{packTitle}}</span><button type="button" class="cm-btn" aria-label="{{closeT}}" onClick="{{togglePack}}"><svg class="cm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div>
        <div style="flex:1;min-height:0;overflow-y:auto;padding:4px 8px 8px">
          <sc-if value="{{packEmpty}}" hint-placeholder-val="{{false}}"><div style="padding:8px;font-size:16px;font-weight:500;line-height:1.6;color:#5A6377">{{packEmptyT}}</div></sc-if>
          <sc-for list="{{packItems}}" as="pi" hint-placeholder-count="0">
            <div style="display:flex;align-items:center;gap:0">
              <button type="button" class="cm-it cm-pk" onClick="{{pi.use}}" style="flex:1;min-width:0;min-height:56px"><span aria-hidden="true" style="{{pi.dot}}"></span><span style="flex:1;min-width:0"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{pi.label}}</span><span class="cm-sub">{{pi.sub}}</span></span></button>
              <button type="button" class="cm-btn" aria-label="{{pi.delAria}}" onClick="{{pi.del}}"><svg class="cm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
      <div id="cm-menu" role="menu" aria-label="{{menuAria}}" style="{{menuSt}}">
        <sc-for list="{{menuItems}}" as="m" hint-placeholder-count="0">
          <sc-if value="{{m.isSep}}" hint-placeholder-val="{{false}}"><div role="separator" style="height:1px;margin:4px 8px;background:#DCE3EC"></div></sc-if>
          <sc-if value="{{m.isItem}}" hint-placeholder-val="{{true}}"><button type="button" id="{{m.eid}}" role="menuitem" class="{{m.cls}}" aria-disabled="{{m.ad}}" tabindex="{{m.ti}}" onClick="{{m.click}}"><svg class="cm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{m.icon}}"></path></svg><span style="flex:1;min-width:0"><span style="display:block">{{m.label}}</span><sc-if value="{{m.hasSub}}" hint-placeholder-val="{{false}}"><span class="cm-sub">{{m.sub}}</span></sc-if></span><sc-if value="{{m.hasKbd}}" hint-placeholder-val="{{false}}"><span class="cm-kbd">{{m.kbd}}</span></sc-if></button></sc-if>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{hasHelp}}" hint-placeholder-val="{{false}}">
      <div id="cm-help" role="dialog" aria-label="{{helpC.title}}" style="{{helpC.st}}">
        <div style="font-size:16px;font-weight:700;line-height:1.5">{{helpC.title}}</div>
        <div style="margin-top:4px;font-size:16px;font-weight:500;line-height:1.6;color:#14243D">{{helpC.body}}</div>
        <div style="display:flex;justify-content:flex-end;margin-top:4px"><button type="button" class="cm-tx cm-btn" style="width:auto;padding:0 12px" onClick="{{helpC.close}}">{{closeT}}</button></div>
      </div>
    </sc-if>

    <sc-if value="{{hasRing}}" hint-placeholder-val="{{false}}">
      <svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true" style="{{ringSt}}"><circle cx="40" cy="40" r="32" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="11"></circle><circle cx="40" cy="40" r="32" fill="none" stroke="#14243D" stroke-width="6" stroke-opacity="0.25"></circle><circle class="cm-ring-p" cx="40" cy="40" r="32" fill="none" stroke="#14243D" stroke-width="6" stroke-linecap="round" transform="rotate(-90 40 40)"></circle></svg>
    </sc-if>

    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <div role="status" aria-live="polite" style="position:absolute;left:24px;bottom:16px;max-width:560px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 16px;border-radius:12px;background:#14243D;color:#FFFFFF;font-size:16px;font-weight:600;line-height:1.5;box-shadow:0 8px 20px rgba(20,36,61,0.2);z-index:45"><span style="padding:8px 0">{{toastT}}</span><sc-if value="{{toastUndo}}" hint-placeholder-val="{{false}}"><button type="button" class="cm-btn cm-tx" style="width:auto;padding:0 14px;color:#FFFFFF;border:2px solid #FFFFFF" onClick="{{doUndoBtn}}">{{undoT}}</button></sc-if></div>
    </sc-if>

    <sc-if value="{{dlg}}" hint-placeholder-val="{{false}}">
      <div style="position:absolute;left:0;top:0;width:1280px;height:740px;background:rgba(20,36,61,0.35);z-index:50;display:flex;align-items:center;justify-content:center">
        <div role="alertdialog" aria-modal="true" aria-labelledby="cm-dlg-t" aria-describedby="cm-dlg-b" style="box-sizing:border-box;width:520px;max-width:100%;padding:24px;background:#FFFFFF;border-radius:16px;box-shadow:0 16px 40px rgba(20,36,61,0.3);display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:center;gap:12px"><span aria-hidden="true" style="flex-shrink:0;width:40px;height:40px;border-radius:12px;background:#FFF4CC;color:#B07F00;display:flex;align-items:center;justify-content:center"><svg class="cm-i" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"></path></svg></span><div id="cm-dlg-t" style="font-size:24px;font-weight:700;line-height:1.3">{{dlgT}}</div></div>
          <div id="cm-dlg-b" style="font-size:16px;font-weight:500;line-height:1.6">{{dlgB}}</div>
          <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:4px">
            <button type="button" id="cm-dlg-no" class="cm-tx" onClick="{{dlgNo}}" style="box-sizing:border-box;height:48px;padding:0 20px;border-radius:12px;border:2px solid #C6D6EA;border-bottom-width:4px;background:#FFFFFF;color:#1866C9;font:700 16px 'IBM Plex Sans Thai',system-ui,sans-serif;cursor:pointer">{{dlgNoT}}</button>
            <button type="button" id="cm-dlg-yes" class="cm-tx" onClick="{{dlgYes}}" style="box-sizing:border-box;height:48px;padding:0 20px;border-radius:12px;border:0;border-bottom:4px solid #8E1B1B;background:#D32F2F;color:#FFFFFF;font:700 16px 'IBM Plex Sans Thai',system-ui,sans-serif;cursor:pointer">{{dlgYesT}}</button>
          </div>
        </div>
      </div>
    </sc-if>
  </div>
  <div role="status" aria-live="polite" class="cm-sr">{{ann}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","default":"th","options":["th","en","zh"],"section":"ต้นแบบ"},"os":{"editor":"enum","default":"win","options":["win","mac"],"section":"ต้นแบบ"},"open":{"editor":"enum","default":"none","options":["none","block","setup","hat","ws","ring","bubble","search","backpack","confirm"],"section":"เปิดตัวอย่างค้างไว้"},"mouseHold":{"editor":"boolean","default":false,"section":"ต้นแบบ"},"badge":{"editor":"boolean","default":false,"section":"ต้นแบบ"},"reduce":{"editor":"boolean","default":false,"section":"ต้นแบบ"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {

      if (S.search.open && (tgt && tgt.closest && tgt.closest('[role="search"]'))) { e.preventDefault(); S.search.open = false; S.ret = 'cm-ws'; S.need = 'ret'; this.up(); return; }
      if (S.help) { e.preventDefault(); S.help = null; S.ret = 'cm-ws'; S.need = 'ret'; this.up(); return; }
      if (S.sel.length) { e.preventDefault(); S.sel = []; this.up(); return; }
    }
    const typing = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA');
    if (!typing && (e.ctrlKey || e.metaKey) && !e.altKey) {
      const lk = String(k).toLowerCase();
      if (lk === 'z') { e.preventDefault(); if (e.shiftKey) this.doRedo(); else this.doUndo(); }
      else if (lk === 'y') { e.preventDefault(); this.doRedo(); }
    }
  }
}
