<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ผลตรวจก่อนรัน A2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #1866C9;outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ls{scrollbar-width:auto;scrollbar-color:#5A6377 #F4F7FB}
.ls::-webkit-scrollbar{width:14px}
.ls::-webkit-scrollbar-track{background:#F4F7FB;border-radius:7px}
.ls::-webkit-scrollbar-thumb{background:#5A6377;border-radius:7px;border:3px solid #F4F7FB}
.row{display:flex;align-items:center;gap:12px;box-sizing:border-box;width:100%;min-height:76px;padding:8px 12px;border-radius:12px;border:2px solid #DCE3EC;border-bottom-width:4px;background:#fff;color:#14243D;text-align:left;font-size:16px;line-height:1.6}
.row:hover{background:#EAF2FD}
.btn2,.btnp{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;box-sizing:border-box;padding:0 16px;border-radius:12px;font-size:16px;font-weight:700;line-height:1.5;white-space:nowrap;flex-shrink:0}
.btn2{border:2px solid #C6D6EA;border-bottom-width:4px;background:#FFFFFF;color:#14243D}
.btn2:hover{background:#EAF2FD}
.btnp{border:0;border-bottom:4px solid #0F4C99;background:#1866C9;color:#FFFFFF}
.btn2:active,.btnp:active{border-bottom-width:2px;transform:translateY(2px)}
</style>
</helmet>
<!-- R17 ป๊อปอัปผลตรวจก่อนรัน · สำเนาของ A2 (PreflightDialog เดิมของบอร์ด A ไม่แก้) · ปรับตาม CI dialog §11.10 (ชุดที่ 3 · 2026-10-26): กว้าง 520 · padding 24 · radius 16 · พื้น surface ไม่มีขอบ · shadow-modal · gap 12 · หัว 24/700 lh 1.3 + กล่องไอคอนเตือน 40×40 (warning-bg + warning-strong) · ปุ่มสูง 48 padding 0 16 radius 12 16/700 ชิดขวา gap 12 · role=alertdialog aria-modal · โฟกัสเริ่มที่ปุ่มปลอดภัย "กลับไปแก้" · Esc ปิด (= กลับไปแก้)
     เนื้อหา R17 คงเดิม: มาสคอตท่า #6 (หลอดไฟ = คิดออก · OQ53) + สรุปจำนวนข้อ + ลิสต์ (เห็นพร้อมกัน 3 ข้อ แล้วเลื่อนในแผง) · mode=run: จำลองต่อได้ (เข้าใจแล้ว) · mode=send: ไม่มีทางข้าม ต้องแก้ครบ · ไม่กะพริบ ไม่หายเอง -->
<div role="alertdialog" aria-modal="true" aria-labelledby="pf2-title" tabindex="-1" onKeyDown="{{onKey}}" style="position:relative;width:520px;min-height:{{rootH}}px;box-sizing:border-box;background:#fff;border-radius:16px;box-shadow:0 16px 40px rgba(20,36,61,.3);padding:24px;display:flex;flex-direction:column;gap:12px;color:#14243D">

  <div style="display:flex;align-items:center;gap:12px">
    <span aria-hidden="true" style="width:40px;height:40px;border-radius:12px;background:#FFF4CC;border:2px solid #B07F00;box-sizing:border-box;color:#B07F00;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg class="i" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg></span>
    <h2 id="pf2-title" style="margin:0;min-width:0;font-size:24px;font-weight:700;line-height:1.3">{{title}}</h2>
  </div>

  <div style="display:flex;gap:16px;align-items:center">
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;width:88px">
      <dc-import name="MascotA2" pose="6" h="88" alt="มาสคอต School Bot ท่าคิดออก (ถือหลอดไฟ)" hint-size="64px,88px"></dc-import>
      <span style="font-size:14px;font-weight:500;line-height:1.6;color:#5A6377">ท่า: คิดออก</span>
    </div>
    <div style="min-width:0;flex:1">
      <div role="status" style="font-size:18px;font-weight:700;line-height:1.6">{{summary}}</div>
      <div style="margin-top:2px;font-size:16px;line-height:1.6;color:#5A6377">{{sub}}</div>
    </div>
  </div>

  <ul class="ls" aria-label="{{listLabel}}" style="list-style:none;margin:0;padding:0 2px 0 0;max-height:{{listH}}px;overflow-y:auto">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
      <li style="margin:0 0 8px 0"><button class="row" onClick="{{it.pick}}" aria-label="{{it.aria}}">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;border-radius:50%;background:#FFF4CC;border:2px solid #B07F00;font-size:16px;font-weight:700;line-height:1.2">{{it.no}}</span>
        <span style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex-shrink:0;box-sizing:border-box;border-radius:12px;border:2px solid #C6D6EA;background:#F4F7FB"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{it.icon}}"/></svg></span>
        <span style="flex:1;min-width:0"><span style="display:block;font-weight:700">{{it.title}}</span><span style="display:block;color:#5A6377">วิธีแก้: {{it.fix}}</span></span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;font-size:14px;line-height:1.5"><span style="color:#5A6377">{{it.code}}</span><span style="display:inline-flex;align-items:center;gap:2px;font-weight:700;color:#0F4C99">ไปดู<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></span>
      </button></li>
    </sc-for>
  </ul>
  <sc-if value="{{hasMore}}" hint-placeholder-val="{{false}}">
    <div style="display:flex;align-items:center;gap:6px;margin-top:-8px;font-size:14px;font-weight:700;line-height:1.6;color:#0F4C99"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><span>{{moreText}}</span></div>
  </sc-if>

  <sc-if value="{{isRun}}" hint-placeholder-val="{{true}}">
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:12px">
      <button type="button" class="btn2" autoFocus="{{yes}}" onClick="{{onBack}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 3v6h6"/></svg><span>กลับไปแก้</span></button>
      <button type="button" class="btnp" onClick="{{onContinue}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg><span>เข้าใจแล้ว จำลองต่อ</span></button>
    </div>
  </sc-if>
  <sc-if value="{{isSend}}" hint-placeholder-val="{{false}}">
    <div style="display:flex;align-items:center;gap:12px">
      <svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <div style="flex:1;min-width:0;font-size:16px;line-height:1.6"><b>ส่งลงบอร์ดไม่ได้ จนกว่าจะแก้ครบ</b><br><span style="color:#5A6377">แก้แล้วกดส่งอีกครั้ง · ถ้ายังขึ้นอยู่ บอกครูพร้อมรหัสท้ายข้อ</span></div>
      <button type="button" class="btnp" autoFocus="{{yes}}" onClick="{{onBack}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 3v6h6"/></svg><span>กลับไปแก้</span></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"run","options":["run","send"]},"n":{"editor":"int","default":3,"min":1,"max":6},"onBack":{"editor":null},"onContinue":{"editor":null},"onPick":{"editor":null},"$preview":{"width":520,"height":540}}'>
class Component extends DCLogic {
  gp(name) {
    const P = this.props || {};
    const kebab = name.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase());
    if (P[name] !== undefined) return P[name];
    if (P[name.toLowerCase()] !== undefined) return P[name.toLowerCase()];
    if (P[kebab] !== undefined) return P[kebab];
    return undefined;
  }
  renderVals() {
    const mode = this.gp('mode') === 'send' ? 'send' : 'run';
    const n = Math.min(6, Math.max(1, Number(this.gp('n')) || 3));
    const onBack = this.gp('onBack') || (() => {});
    const onContinue = this.gp('onContinue') || (() => {});
    const onPick = this.gp('onPick') || (() => {});
    // 4 กรณีของ R17 (OQ49/OQ53 · รหัส E-CHK-xx เป็นชื่อชั่วคราว) เรียงตามชนิด (1) > (2) > (3) > (4) · ต้นเหตุเดียว = 1 ข้อ
    const ICON = {
      1: 'M12 5v14M5 12h14',
      2: 'M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4',
      3: 'M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7',
      4: 'M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01'
    };
    const KIND = { 1: 'ยังไม่ได้วางอุปกรณ์', 2: 'ต่อสายไม่ครบ', 3: 'บล็อกกับขาไม่ตรงกัน', 4: 'วงจรอันตรายต่ออุปกรณ์' };
    const M = {
      A: [1, 'บล็อก "เปิด LED แดง 2" ใช้ LED ที่ยังไม่ได้วาง', 'วาง LED ที่ตัวจำลอง แล้วเลือกในบล็อก', 'E-CHK-01'],
      B: [1, 'บล็อก "เล่นเสียง" ใช้บัซเซอร์ที่ยังไม่ได้วาง', 'วางบัซเซอร์ที่ตัวจำลอง แล้วเลือกในบล็อก', 'E-CHK-01'],
      C: [2, 'ปุ่มกด 1 ยังต่อสายไม่ครบ', 'ต่อขาที่เหลือของปุ่มกดไปที่ Uno และ GND', 'E-CHK-02'],
      D: [2, 'เซอร์โว 1 ยังต่อสายไม่ครบ', 'ต่อสายสัญญาณ ไฟ 5V และ GND ให้ครบ', 'E-CHK-02'],
      E: [3, 'ลูกบิด 1 ต่ออยู่ขาที่อ่านค่าแอนะล็อกไม่ได้', 'ย้ายสายกลางของลูกบิดไปขา A0 ถึง A5', 'E-CHK-03'],
      F: [4, 'LED แดง 1 ไม่มีตัวต้านทาน อาจเสีย', 'ต่อตัวต้านทานเข้ากับ LED', 'E-CHK-04']
    };
    const SETS = { 1: ['A'], 2: ['A', 'C'], 3: ['A', 'C', 'E'], 4: ['A', 'C', 'E', 'F'], 5: ['A', 'B', 'C', 'E', 'F'], 6: ['A', 'B', 'C', 'D', 'E', 'F'] };
    const items = SETS[n].map((k, idx) => {
      const m = M[k];
      return { no: String(idx + 1), icon: ICON[m[0]], title: m[1], fix: m[2], code: m[3], aria: 'ข้อ ' + (idx + 1) + ' ' + KIND[m[0]] + ': ' + m[1] + ' · วิธีแก้: ' + m[2] + ' · กดเพื่อไปดูจุดที่ผิด', pick: () => onPick(idx) };
    });
    const rows = Math.min(n, 3);
    const listH = rows * 84;
    const hasMore = n > 3;
    return {
      yes: true,
      isRun: mode === 'run', isSend: mode === 'send',
      title: mode === 'run' ? 'ก่อนเริ่มจำลอง ลองเช็กตรงนี้นะ' : 'ยังส่งลงบอร์ดไม่ได้ ต้องแก้ก่อนนะ',
      summary: 'เจอ ' + n + ' ข้อที่ควรแก้',
      sub: mode === 'run' ? 'จำลองต่อได้ แต่บล็อกที่ใช้อุปกรณ์ไม่ครบจะถูกข้าม' : 'แก้ครบทุกข้อ แล้วกดส่งลงบอร์ดอีกครั้ง',
      listLabel: 'รายการที่ควรแก้ ' + n + ' ข้อ',
      items, listH: String(listH), hasMore,
      moreText: 'ยังมีอีก ' + (n - 3) + ' ข้อ · เลื่อนดูในรายการ',
      // padding 48 + หัว 40 + มาสคอต 112 + ลิสต์ + ปุ่ม 48 + gap 12 × (3 หรือ 4 ถ้ามีข้อความ "ยังมีอีก") + ข้อความ "ยังมีอีก" 22 (ดึงขึ้น 8)
      rootH: String(48 + 40 + 112 + listH + 48 + 12 * (hasMore ? 4 : 3) + (hasMore ? 22 - 8 : 0)),
      onBack, onContinue,
      onKey: (e) => { if (e && e.key === 'Escape') onBack(); }
    };
  }
}
</script>
</body>
</html>
