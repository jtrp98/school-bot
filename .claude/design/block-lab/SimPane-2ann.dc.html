<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ตัวจำลองบอร์ด</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #B85E00;outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.dv{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:76px;height:52px;padding:0;border-radius:12px;border:2px solid #C6D6EA;border-bottom-width:4px;background:#fff;color:#14243D;font-size:16px;font-weight:600;line-height:1.4}
.zm{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:12px;border:2px solid #C6D6EA;border-bottom-width:4px;background:#fff;color:#14243D}
</style>
</helmet>
<!-- SCR-17 ตัวจำลองบอร์ด (ภาพอุปกรณ์เวกเตอร์สไตล์เรียบ · DSG-09 · สีภาพประกอบเป็นค่าชั่วคราว) -->
<div style="position:relative;width:680px;height:{{rootH}}px;background:#fff;overflow:hidden;color:#14243D">

  <!-- แผงอุปกรณ์ (แตะเลือก แล้วแตะรูบน breadboard เพื่อวาง หรือลากมาวาง) -->
  <div style="position:absolute;left:0;top:0;width:680px;height:64px;box-sizing:border-box;background:#F4F7FB;border-bottom:2px solid #DCE3EC;display:flex;align-items:center;gap:4px;padding:0 8px 0 10px">
    <button class="dv" aria-label="LED"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v6h12V9a6 6 0 0 0-6-6zM9 15v6M15 15v6"></path></svg><span>LED</span></button>
    <button class="dv" aria-label="ตัวต้านทาน"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l2-5 3 10 3-10 2 5h6"></path></svg><span>ตัวต้านทาน</span></button>
    <button class="dv" aria-label="ปุ่มกด"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v8H4zM12 11V6M8 6h8"></path></svg><span>ปุ่มกด</span></button>
    <button class="dv" aria-label="บัซเซอร์"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"></path></svg><span>บัซเซอร์</span></button>
    <button class="dv" aria-label="ลูกบิด (potentiometer)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 12l4-4"></path></svg><span>ลูกบิด</span></button>
    <button class="dv" aria-label="เซอร์โว"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h12v10H3zM15 11h5v4h-5zM7 8V5"></path></svg><span>เซอร์โว</span></button>
    <button class="dv" aria-label="ไฟ RGB"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v6h12V9a6 6 0 0 0-6-6zM8 15v6M11 15v6M13 15v6M16 15v6"></path></svg><span>ไฟ RGB</span></button>
    <div style="flex:1"></div>
    <button class="zm" aria-label="ซูมออก"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
    <button class="zm" aria-label="ซูมเข้า"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <!-- ผืนผ้าใบวงจร -->
  <div style="position:absolute;left:0;top:64px;width:680px;height:{{canvasH}}px">

    <svg width="680" height="360" viewBox="0 0 680 360" style="position:absolute;left:0;top:0" aria-hidden="true">
      <defs>
        <pattern id="hr" width="28" height="24" patternUnits="userSpaceOnUse" patternTransform="translate(10,8)"><circle cx="14" cy="12" r="4.5" fill="#3B4252"></circle></pattern>
        <pattern id="hb1" width="28" height="24" patternUnits="userSpaceOnUse" patternTransform="translate(10,16)"><circle cx="14" cy="12" r="4.5" fill="#3B4252"></circle></pattern>
        <pattern id="hb2" width="28" height="24" patternUnits="userSpaceOnUse" patternTransform="translate(10,12)"><circle cx="14" cy="12" r="4.5" fill="#3B4252"></circle></pattern>
        <pattern id="ps1" width="28" height="22" patternUnits="userSpaceOnUse" patternTransform="translate(8,16)"><circle cx="14" cy="11" r="4.5" fill="#DCE3EC"></circle></pattern>
        <pattern id="ps2" width="28" height="22" patternUnits="userSpaceOnUse" patternTransform="translate(0,16)"><circle cx="14" cy="11" r="4.5" fill="#DCE3EC"></circle></pattern>
      </defs>
      <!-- Uno -->
      <rect x="6" y="26" width="40" height="44" rx="4" fill="#C6D6EA" stroke="#5A6377" stroke-width="2"></rect>
      <rect x="16" y="8" width="488" height="96" rx="10" fill="#0F7C86" stroke="#0A5A62" stroke-width="2"></rect>
      <text x="64" y="36" fill="#FFFFFF" font-size="18" font-weight="700">Arduino Uno</text>
      <text x="36" y="58" fill="#FFFFFF" font-size="14" font-weight="600">ขาดิจิทัล</text>
      <text x="420" y="58" fill="#FFFFFF" font-size="14" font-weight="600">แอนะล็อก / ไฟ</text>
      <rect x="36" y="82" width="364" height="22" rx="3" fill="#14243D"></rect>
      <rect x="36" y="82" width="364" height="22" fill="url(#ps1)"></rect>
      <rect x="420" y="82" width="84" height="22" rx="3" fill="#14243D"></rect>
      <rect x="420" y="82" width="84" height="22" fill="url(#ps2)"></rect>
      <g fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">
        <text x="50" y="77">GND</text><text x="78" y="77">13</text><text x="106" y="77">12</text><text x="134" y="77">11</text><text x="162" y="77">10</text><text x="190" y="77">9</text><text x="218" y="77">8</text><text x="246" y="77">7</text><text x="274" y="77">6</text><text x="302" y="77">5</text><text x="330" y="77">4</text><text x="358" y="77">3</text><text x="386" y="77">2</text>
        <text x="434" y="77">A0</text><text x="462" y="77">5V</text><text x="490" y="77">GND</text>
      </g>
      <!-- breadboard -->
      <rect x="16" y="124" width="648" height="224" rx="14" fill="#EFEBDD" stroke="#B9B196" stroke-width="2"></rect>
      <line x1="38" y1="130" x2="654" y2="130" stroke="#D32F2F" stroke-width="2"></line>
      <line x1="38" y1="176" x2="654" y2="176" stroke="#1866C9" stroke-width="2"></line>
      <rect x="38" y="128" width="616" height="48" fill="url(#hr)"></rect>
      <rect x="38" y="184" width="616" height="72" fill="url(#hb1)"></rect>
      <rect x="16" y="258" width="648" height="16" fill="#DDD7C2"></rect>
      <rect x="38" y="276" width="616" height="72" fill="url(#hb2)"></rect>
      <g fill="#14243D" font-size="16" font-weight="700" text-anchor="middle"><text x="27" y="146">+</text><text x="27" y="170">-</text></g>
    </svg>

    <!-- วงจรร่วม: สาย GND/5V/ขา 2, ปุ่ม, ลูกบิด, ขา LED -->
    <sc-if value="{{hasCircuit}}" hint-placeholder-val="{{true}}">
      <svg width="680" height="360" viewBox="0 0 680 360" style="position:absolute;left:0;top:0" aria-hidden="true">
        <g fill="none" stroke-width="5" stroke-linecap="round">
          <path d="M490 104 C490 128 640 120 640 164" stroke="#14243D"></path>
          <path d="M462 104 C462 124 612 112 612 140" stroke="#D32F2F"></path>
          <path d="M332 196 L332 164" stroke="#14243D"></path>
          <path d="M386 104 C386 150 444 150 444 196" stroke="#B07F00"></path>
          <path d="M500 312 L528 312 L528 164" stroke="#14243D"></path>
          <path d="M556 196 L556 164" stroke="#14243D"></path>
          <path d="M612 196 L612 140" stroke="#D32F2F"></path>
          <path d="M584 196 C584 150 434 150 434 104" stroke="#3E8A2F"></path>
        </g>
        <g fill="#8A93A5" stroke="#5A6377" stroke-width="2"><circle cx="304" cy="244" r="4"></circle><circle cx="332" cy="244" r="4"></circle></g>
        <path d="M310 236 L304 244 M326 236 L332 244" stroke="#8A93A5" stroke-width="3" fill="none"></path>
        <rect x="440" y="242" width="68" height="50" rx="8" fill="#2B3140"></rect>
        <rect x="548" y="204" width="72" height="44" rx="8" fill="#2B3140"></rect>
        <g fill="#14243D" font-size="14" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#EFEBDD" stroke-width="4">
          <text x="474" y="236">ปุ่มกด ขา 2</text><text x="584" y="270">ลูกบิด</text>
        </g>
      </svg>
    </sc-if>

    <!-- ตัวต้านทาน 220 Ω + สาย 9 (ปกติ / ลัดวงจร) -->
    <sc-if value="{{hasResistor}}" hint-placeholder-val="{{true}}">
      <svg width="680" height="360" viewBox="0 0 680 360" style="position:absolute;left:0;top:0" aria-hidden="true">
        <path d="M190 104 C190 150 192 160 192 196" stroke="#1866C9" stroke-width="5" stroke-linecap="round" fill="none"></path>
        <path d="M192 196 L206 196 M290 196 L304 196" stroke="#8A93A5" stroke-width="3" stroke-linecap="round"></path>
        <rect x="206" y="186" width="84" height="20" rx="10" fill="#D8B98A" stroke="#A9895A" stroke-width="2"></rect>
        <rect x="220" y="186" width="6" height="20" fill="#C62828"></rect><rect x="232" y="186" width="6" height="20" fill="#C62828"></rect><rect x="244" y="186" width="6" height="20" fill="#6D4C41"></rect><rect x="268" y="186" width="6" height="20" fill="#C9A227"></rect>
        <circle cx="192" cy="196" r="5" fill="#8A93A5"></circle><circle cx="304" cy="196" r="5" fill="#8A93A5"></circle>
        <text x="248" y="180" fill="#14243D" font-size="14" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#EFEBDD" stroke-width="4">220 Ω</text>
      </svg>
    </sc-if>
    <!-- ไม่มีตัวต้านทาน: ต่อสาย 9 ตรงเข้า LED -->
    <sc-if value="{{hasDirect}}" hint-placeholder-val="{{false}}">
      <svg width="680" height="360" viewBox="0 0 680 360" style="position:absolute;left:0;top:0" aria-hidden="true">
        <path d="M190 104 C190 150 304 150 304 196" stroke="#1866C9" stroke-width="5" stroke-linecap="round" fill="none"></path>
        <circle cx="304" cy="196" r="5" fill="#1866C9"></circle>
      </svg>
    </sc-if>
    <!-- ลัดวงจร: สายต่อไฟ + เข้ากับ - ของ breadboard -->
    <sc-if value="{{hasShort}}" hint-placeholder-val="{{false}}">
      <svg width="680" height="360" viewBox="0 0 680 360" style="position:absolute;left:0;top:0" aria-hidden="true">
        <path d="M136 140 C96 146 96 158 136 164" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" fill="none"></path>
        <path d="M136 140 C96 146 96 158 136 164" stroke="#D32F2F" stroke-width="6" stroke-linecap="round" fill="none"></path>
      </svg>
      <div style="position:absolute;left:150px;top:128px;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;background:#fff;border:2px solid #D32F2F;color:#D32F2F;font-size:16px;font-weight:700;white-space:nowrap"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"></path></svg>ลัดวงจร</div>
    </sc-if>

    <!-- LED (แสงเปลี่ยนไม่เกิน 3 ครั้ง/วินาที · ไม่กะพริบ) -->
    <sc-if value="{{hasCircuit}}" hint-placeholder-val="{{true}}">
      <div style="{{glowStyle}}"></div>
      <div style="{{domeStyle}}"></div>
      <sc-if value="{{ledBroken}}" hint-placeholder-val="{{false}}">
        <svg class="i" viewBox="0 0 24 24" style="position:absolute;left:305px;top:211px;width:26px;height:26px;color:#14243D" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        <div style="position:absolute;left:292px;top:198px;width:52px;height:52px;box-sizing:border-box;border:3px dashed #D32F2F;border-radius:50%"></div>
      </sc-if>
      <sc-if value="{{hasLedChip}}" hint-placeholder-val="{{true}}">
        <div style="{{ledChipStyle}}"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px" aria-hidden="true"><path d="{{ledChipIcon}}"></path></svg><span>{{ledChipText}}</span></div>
      </sc-if>

      <!-- ปุ่มกด: โต้ตอบเมาส์/คีย์บอร์ด/สัมผัส -->
      <button aria-label="ปุ่มกด ขา 2 กดค้างไว้เพื่อทดลอง" aria-pressed="{{isPressed}}" aria-disabled="{{notRunning}}" onMouseDown="{{onPress}}" onMouseUp="{{onRelease}}" onMouseLeave="{{onRelease}}" onTouchStart="{{onPress}}" onTouchEnd="{{onRelease}}" onKeyDown="{{onKeyDown}}" onKeyUp="{{onKeyUp}}" style="position:absolute;left:440px;top:242px;width:68px;height:50px;padding:0;border:0;background:transparent;border-radius:8px"><span style="{{capStyle}}"></span></button>

      <!-- ลูกบิด: ปุ่มหมุนแสดงค่า -->
      <div style="position:absolute;left:568px;top:210px;width:32px;height:32px;box-sizing:border-box;border-radius:50%;background:#DCE3EC;border:2px solid #8A93A5"><div style="{{knobStyle}}"></div></div>
    </sc-if>

    <!-- สถานะขา Uno -->
    <div style="position:absolute;left:516px;top:8px;width:148px;height:108px;box-sizing:border-box;padding:4px 10px;border-radius:12px;background:#fff;border:2px solid #DCE3EC" role="status">
      <div style="font-size:16px;font-weight:700;line-height:24px">สถานะขา</div>
      <div style="display:flex;justify-content:space-between;font-size:16px;line-height:24px"><span style="color:#5A6377">ขา 9</span><span style="font-weight:700">{{v9}}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:16px;line-height:24px"><span style="color:#5A6377">ขา 2</span><span style="font-weight:700">{{v2}}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:16px;line-height:24px"><span style="color:#5A6377">A0</span><span style="font-weight:700">{{vA0}}</span></div>
    </div>

    <!-- ว่าง (ST-40): บอกวิธีเริ่ม -->
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div style="position:absolute;left:100px;top:150px;width:480px;height:176px;box-sizing:border-box;display:flex;align-items:center;gap:16px;padding:12px 20px;border-radius:16px;background:#fff;border:2px solid #DCE3EC;box-shadow:0 8px 20px rgba(20,36,61,.2)">
        <dc-import name="Mascot" pose="8" h="120" alt="มาสคอต School Bot ท่าถือแท็บเล็ต" hint-size="87px,120px"></dc-import>
        <div style="flex:1;min-width:0">
          <div style="font-size:18px;font-weight:700;line-height:1.5;margin-bottom:4px">เริ่มต่อวงจรกันเลย</div>
          <div style="font-size:16px;line-height:1.6">1. แตะอุปกรณ์ข้างบน แล้วแตะรูบน breadboard (หรือลากมาวาง)</div>
          <div style="font-size:16px;line-height:1.6">2. แตะรูของ Uno แล้วแตะอีกรู เพื่อต่อสาย</div>
        </div>
      </div>
    </sc-if>

    <!-- แถบล่างของตัวจำลอง -->
    <div style="{{stripStyle}}">
      <sc-if value="{{isBroken}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;align-items:center;gap:12px;width:100%;height:100%;box-sizing:border-box;padding:0 10px;border-radius:12px;background:#FFF4CC;border:2px solid #B07F00">
          <dc-import name="Mascot" pose="6" h="64" alt="มาสคอต School Bot ท่าหลอดไฟ บอกสาเหตุ" hint-size="46px,64px"></dc-import>
          <div style="flex:1;min-width:0;line-height:1.45">
            <div style="font-size:18px;font-weight:700">{{brokenTitle}} <span style="font-size:14px;font-weight:500;color:#5A6377">{{brokenCode}}</span></div>
            <div style="font-size:16px">{{brokenCause}}</div>
            <div style="font-size:16px">{{brokenFix}}</div>
          </div>
          <button style="flex-shrink:0;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;border:2px solid #1866C9;border-bottom:4px solid #0F4C99;background:#1866C9;color:#fff;font-size:16px;font-weight:700">{{brokenButton}}</button>
        </div>
      </sc-if>
      <sc-if value="{{showControls}}" hint-placeholder-val="{{true}}">
        <div style="display:flex;align-items:center;gap:16px;width:100%;height:100%;padding:0 6px;box-sizing:border-box">
          <svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px;color:#5A6377" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 16v-4M12 8h.01"></path></svg>
          <div style="flex:1;min-width:0;font-size:16px;line-height:1.6"><div style="font-weight:700">{{hintTitle}}</div><div style="color:#5A6377">{{hintBody}}</div></div>
          <div style="width:250px;flex-shrink:0;display:flex;flex-direction:column;opacity:{{ctrlOpacity}}">
            <label for="pot" style="font-size:16px;font-weight:700;line-height:1.5">ลูกบิด A0 <span style="font-family:Consolas,ui-monospace,monospace;font-size:18px">{{potText}}</span></label>
            <input id="pot" type="range" min="0" max="1023" step="1" value="{{pot}}" onInput="{{onPot}}" aria-disabled="{{notRunning}}" aria-valuetext="{{potText}}" style="width:100%;height:44px;margin:0;accent-color:#1866C9">
          </div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"circuit":{"editor":"enum","default":"ok","options":["empty","ok","led-no-r","short"]},"run":{"editor":"enum","default":"running","options":["idle","compiling","running","compile-error","ended","edited","broken"]},"pressed":{"editor":"enum","default":"no","options":["no","yes"]},"pot":{"editor":"int","default":512,"min":0,"max":1023},"led":{"editor":"enum","default":"off","options":["off","on","fast"]},"h":{"editor":"int","default":498},"onPress":{"editor":null},"onRelease":{"editor":null},"onKeyDown":{"editor":null},"onKeyUp":{"editor":null},"onPot":{"editor":null},"$preview":{"width":680,"height":498}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    const run = this.props.run || 'idle';
    const running = run === 'running';
    const circuit = this.props.circuit || 'ok';
    const pressed = this.props.pressed === 'yes' && running;
    const pot = Math.min(1023, Math.max(0, Number(this.props.pot !== undefined ? this.props.pot : 512) || 0));
    const h = Number(this.props.h) || 498;
    const canvasH = h - 64;
    const isEmpty = circuit === 'empty';
    const ledBroken = circuit === 'led-no-r';
    const isShort = circuit === 'short';
    const isBroken = ledBroken || isShort;
    let led = this.props.led || 'off';
    if (!running) led = 'off';

    // LED
    let fill = '#F1EAD0', stroke = '#8A93A5', glowA = 0;
    let chipText = running ? 'LED ดับ' : 'LED', chipIcon = 'M12 3a6 6 0 0 0-6 6v6h12V9a6 6 0 0 0-6-6zM9 15v6M15 15v6', chipBorder = '#DCE3EC', chipColor = '#14243D';
    let hasLedChip = !isEmpty;
    if (led === 'on') { fill = '#FFD84D'; stroke = '#B07F00'; glowA = 0.85; chipText = 'LED ติด'; }
    if (led === 'fast') { fill = '#FFE9A0'; stroke = '#B07F00'; glowA = 0.5; chipText = 'สลับเร็ว · แสงกลาง ๆ'; chipIcon = 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 16v-4M12 8h.01'; }
    if (ledBroken) { fill = '#A3ABB8'; stroke = '#5A6377'; glowA = 0; chipText = 'LED เสีย'; chipIcon = 'M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01'; chipBorder = '#D32F2F'; chipColor = '#D32F2F'; }
    if (!running && !ledBroken) hasLedChip = false;

    const ledOn = led === 'on' || led === 'fast';
    const v = (b, t) => running ? (b ? 'สูง' : 'ต่ำ') : '—';
    const deg = Math.round((pot / 1023) * 270 - 135);

    // แถบล่าง
    const stripH = canvasH - 350 - 6;
    let brokenTitle = '', brokenCode = '', brokenCause = '', brokenFix = '', brokenButton = '';
    if (ledBroken) { brokenTitle = 'LED เสียแล้ว'; brokenCode = 'E-SIM-01'; brokenCause = 'ไฟแรงเกินไป เพราะ LED ไม่มีตัวต้านทาน'; brokenFix = 'ต่อตัวต้านทานก่อน LED แล้วกด "เปลี่ยน LED ใหม่"'; brokenButton = 'เปลี่ยน LED ใหม่'; }
    if (isShort) { brokenTitle = 'สายนี้ลัดวงจร'; brokenCode = 'E-SIM-02'; brokenCause = 'สายต่อไฟ + เข้ากับ - โดยตรง ไฟจึงไหลแรงเกินไป'; brokenFix = 'เอาสายสีแดงที่ไฮไลต์ออก แล้วเริ่มจำลองใหม่'; brokenButton = 'เอาสายนี้ออก'; }
    let hintTitle = 'ลองกดปุ่มในวงจรค้างไว้', hintBody = 'ใช้เมาส์ หรือโฟกัสปุ่มแล้วกด Space / Enter ค้างไว้';
    if (!running) { hintTitle = 'กดเริ่มจำลองก่อน'; hintBody = 'แล้วค่อยลองกดปุ่มและหมุนลูกบิดได้'; }
    if (isEmpty) { hintTitle = 'ยังไม่มีปุ่มและลูกบิดในวงจร'; hintBody = 'ต่อวงจรก่อน แล้วจะลองกดและหมุนได้ที่นี่'; }

    return {
      rootH: h, canvasH,
      hasCircuit: !isEmpty, isEmpty,
      hasResistor: !isEmpty && !ledBroken, hasDirect: ledBroken, hasShort: isShort,
      ledBroken, hasLedChip,
      glowStyle: 'position:absolute;left:284px;top:190px;width:68px;height:68px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,216,77,' + glowA + ') 0%,rgba(255,216,77,0) 70%)',
      domeStyle: 'position:absolute;left:302px;top:208px;width:32px;height:32px;box-sizing:border-box;border-radius:50%;background:' + fill + ';border:2px solid ' + stroke,
      ledChipText: chipText, ledChipIcon: chipIcon,
      ledChipStyle: 'position:absolute;left:342px;top:206px;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;background:#fff;font-size:16px;font-weight:700;white-space:nowrap;border:2px solid ' + chipBorder + ';color:' + chipColor,
      isPressed: pressed, notRunning: !running,
      capStyle: 'position:absolute;left:18px;top:' + (pressed ? 11 : 9) + 'px;width:32px;height:32px;box-sizing:border-box;border-radius:50%;background:' + (pressed ? '#8A93A5' : '#DCE3EC') + ';border:2px solid #8A93A5;' + (pressed ? 'box-shadow:none' : 'box-shadow:0 3px 0 #5A6377'),
      knobStyle: 'position:absolute;left:11px;top:2px;width:4px;height:12px;border-radius:2px;background:#14243D;transform-origin:2px 12px;transform:rotate(' + deg + 'deg)',
      v9: running ? (ledOn ? 'สูง' : 'ต่ำ') : '—',
      v2: running ? (pressed ? 'สูง (กด)' : 'ต่ำ') : '—',
      vA0: running ? String(pot) : '—',
      stripStyle: 'position:absolute;left:16px;top:350px;width:648px;height:' + stripH + 'px;display:flex;align-items:center',
      isBroken, showControls: !isBroken,
      brokenTitle, brokenCode, brokenCause, brokenFix, brokenButton,
      hintTitle, hintBody, ctrlOpacity: running ? '1' : '0.55',
      pot: String(pot), potText: String(pot),
      onPress: running ? (this.props.onPress || noop) : noop,
      onRelease: running ? (this.props.onRelease || noop) : noop,
      onKeyDown: running ? (this.props.onKeyDown || noop) : noop,
      onKeyUp: running ? (this.props.onKeyUp || noop) : noop,
      onPot: running ? (this.props.onPot || noop) : noop
    };
  }
}
</script>
