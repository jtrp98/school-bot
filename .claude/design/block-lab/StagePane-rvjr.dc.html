<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Stage มาสคอต</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #B85E00;outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<!-- SCR-18 stage · มาสคอตตัวเดียว 10 ท่า · ข้อความกำกับท่าเสมอ · ไม่กะพริบ -->
<div style="position:relative;width:680px;height:{{rootH}}px;background:#fff;color:#14243D;overflow:hidden">

  <div style="position:absolute;left:0;top:0;width:680px;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;box-sizing:border-box">
    <span style="display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:#EAF2FD;border:2px solid #C6D6EA;font-size:16px;font-weight:700" role="status">ท่า: {{poseName}}</span>
    <span style="font-size:14px;color:#5A6377">ตำแหน่ง x {{px}} · y {{py}}</span>
    <div style="flex:1"></div>
    <button style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:2px solid #C6D6EA;border-bottom-width:4px;background:#fff;color:#14243D;font-size:16px;font-weight:600"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 3v6h6"></path></svg><span>รีเซ็ตตำแหน่ง</span></button>
  </div>

  <!-- เวที -->
  <div style="{{stageStyle}}">
    <div style="position:absolute;left:0;right:0;bottom:0;height:44px;background:#EAF2FD;border-top:2px solid #DCE3EC"></div>

    <sc-if value="{{hasChip}}" hint-placeholder-val="{{true}}">
      <div style="{{chipStyle}}" role="status"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{chipIcon}}"></path></svg><span>{{chipText}}</span></div>
    </sc-if>

    <div style="{{mascotWrap}}">
      <sc-if value="{{hasSay}}" hint-placeholder-val="{{true}}">
        <div style="position:relative;max-width:280px;min-width:80px;box-sizing:border-box;background:#fff;border:2px solid #14243D;border-radius:16px;padding:6px 14px;margin-bottom:12px;font-size:18px;font-weight:500;line-height:1.7;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden">{{say}}</div>
      </sc-if>
      <dc-import name="Mascot" pose="{{pose}}" h="144" alt="{{mascotAlt}}" hint-size="96px,144px"></dc-import>
    </div>

    <div style="{{captionStyle}}">{{poseName}}</div>
  </div>

  <div style="position:absolute;left:16px;right:16px;bottom:0;height:52px;display:flex;align-items:center;gap:10px;font-size:16px;line-height:1.6;color:#5A6377">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12H3zM8 21h8M12 16v5"></path></svg>
    <span>บล็อกตัวละครทำงานเฉพาะในจอ · ส่งลงบอร์ดแล้วจะข้ามไป</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pose":{"editor":"int","default":1,"min":1,"max":10},"say":{"editor":"text","default":""},"x":{"editor":"int","default":0,"min":-100,"max":100},"y":{"editor":"int","default":0,"min":0,"max":120},"frozen":{"editor":"text","default":""},"fast":{"editor":"enum","default":"no","options":["no","yes"]},"state":{"editor":"enum","default":"idle","options":["idle","running"]},"h":{"editor":"int","default":498},"$preview":{"width":680,"height":498}}'>
class Component extends DCLogic {
  renderVals() {
    const NAMES = ['', 'โบกมือ · สวัสดี', 'ดีใจ', 'สงสัย', 'ค้นหา', 'รัก', 'คิดออก', 'วิ่ง', 'อ่าน', 'เย่!', 'เยี่ยม'];
    const pose = Math.min(10, Math.max(1, Number(this.props.pose) || 1));
    const h = Number(this.props.h) || 498;
    const x = Math.min(100, Math.max(-100, Number(this.props.x) || 0));
    const y = Math.min(120, Math.max(0, Number(this.props.y) || 0));
    const say = this.props.say || '';
    const frozen = this.props.frozen || '';
    const fast = this.props.fast === 'yes';
    const running = this.props.state === 'running';
    const stageH = h - 120;
    let hasChip = true, chipText = '', chipIcon = '', chipBg = '#EAF2FD;border:2px solid #C6D6EA';
    if (frozen) { chipText = frozen; chipIcon = 'M8 5v14M16 5v14'; chipBg = '#FFF4CC;border:2px solid #B07F00'; }
    else if (fast) { chipText = 'สลับท่าเร็วมาก · แสดงท่านิ่ง ๆ ไว้ก่อน'; chipIcon = 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 16v-4M12 8h.01'; }
    else if (!running) { chipText = 'ยังไม่ได้เริ่มจำลอง · กดเริ่มจำลองเพื่อดูตัวละครขยับ'; chipIcon = 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 16v-4M12 8h.01'; }
    else hasChip = false;
    const left = 'calc(50% + ' + Math.round(x * 2.4) + 'px)';
    return {
      rootH: h, pose: String(pose), poseName: NAMES[pose],
      px: String(x), py: String(y),
      say, hasSay: !!say,
      mascotAlt: 'มาสคอต School Bot ท่า ' + NAMES[pose],
      stageStyle: 'position:absolute;left:16px;top:60px;width:648px;height:' + stageH + 'px;box-sizing:border-box;border:2px solid #DCE3EC;border-radius:16px;overflow:hidden;background-color:#fff;background-image:radial-gradient(#DCE3EC 1.5px,transparent 1.5px);background-size:24px 24px',
      mascotWrap: 'position:absolute;left:' + left + ';bottom:' + (46 + y) + 'px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center',
      captionStyle: 'position:absolute;left:' + left + ';bottom:8px;transform:translateX(-50%);display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:#fff;border:2px solid #C6D6EA;font-size:16px;font-weight:600;white-space:nowrap;z-index:2',
      hasChip, chipText, chipIcon,
      chipStyle: 'position:absolute;left:50%;top:12px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;font-size:16px;font-weight:600;white-space:nowrap;background:' + chipBg
    };
  }
}
</script>
</body>
</html>
